<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dutch Mastery Elite</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

<style>
:root{
--blue:#1565c0;--bg:#f8f9fb;--card:#fff;--border:#e5e7eb;
--green:#2e7d32;--red:#c62828;--orange:#f57c00;
--green-light:#e8f5e9;--red-light:#ffebee;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
height:100%;
font-family:Nunito;
background:var(--bg);
overflow:auto;
}

/* FIXED LAYOUT */
#app-wrapper{
min-height:100vh;
display:flex;
flex-direction:column;
}

/* SCREENS */
.screen{display:none;flex:1;flex-direction:column}
.active-screen{display:flex}

/* NAV */
.nav-header{
height:55px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px;
background:var(--card);
border-bottom:1px solid var(--border);
}
.back-btn{
background:#e3f2fd;border:none;padding:6px 12px;border-radius:20px;
}

/* CHAT */
#chat-window{
flex:1;
overflow-y:auto;
padding:12px;
padding-bottom:90px;
}

.msg{
padding:10px 14px;
border-radius:16px;
max-width:80%;
margin-bottom:6px;
}
.bot{background:#fff;border:1px solid var(--border)}
.user{background:var(--blue);color:white;margin-left:auto}
.correct-msg{background:var(--green-light);color:var(--green)}
.wrong-msg{background:var(--red-light);color:var(--red)}

.chat-input-area{
position:sticky;
bottom:0;
display:flex;
gap:8px;
padding:10px;
background:var(--card);
border-top:1px solid var(--border);
}

.chat-input-area input{
flex:1;
padding:12px;
border-radius:20px;
border:2px solid var(--border);
}

.send-btn{
background:var(--blue);
color:white;
border:none;
padding:12px 16px;
border-radius:20px;
}

/* QUIZ */
.quiz-body{
flex:1;
padding:16px;
display:flex;
flex-direction:column;
justify-content:center;
}

.quiz-q{
font-size:1.8rem;
font-weight:900;
text-align:center;
margin-bottom:20px;
}

#quiz-options{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.quiz-opt{
padding:14px;
border-radius:12px;
border:2px solid var(--border);
background:white;
}

.quiz-opt.correct{background:var(--green-light)}
.quiz-opt.wrong{background:var(--red-light)}

</style>
</head>

<body>

<div id="app-wrapper">

<!-- HOME -->
<div id="screen-setup" class="screen active-screen" style="padding:20px;text-align:center">
<h2>Dutch Mastery 🇳🇱</h2><br>
<input type="file" id="file-input" accept=".xlsx" onchange="loadData(event)">
<br><br>
<button onclick="goMode()" id="go-btn" disabled>Start</button>
</div>

<!-- MODE -->
<div id="screen-mode" class="screen" style="padding:20px">
<button onclick="enterMode('chat')">Chat Mode</button><br><br>
<button onclick="enterMode('quiz')">Quiz Mode</button>
</div>

<!-- CHAT -->
<div id="screen-chat" class="screen">
<div class="nav-header">
<button class="back-btn" onclick="showScreen('screen-mode')">Back</button>
<span>Chat</span>
<div></div>
</div>

<div id="chat-window"></div>

<div class="chat-input-area">
<input id="chat-in" placeholder="Type Dutch...">
<button class="send-btn" onclick="submitChat()">➔</button>
</div>
</div>

<!-- QUIZ -->
<div id="screen-quiz" class="screen">
<div class="nav-header">
<button class="back-btn" onclick="showScreen('screen-mode')">Back</button>
<span>Quiz</span>
<div></div>
</div>

<div class="quiz-body">
<div id="quiz-q" class="quiz-q"></div>
<div id="quiz-options"></div>
</div>
</div>

</div>

<script>
let data=[],i=0,mode='chat';

/* FILE */
function loadData(e){
const f=e.target.files[0];
const r=new FileReader();
r.onload=x=>{
const wb=XLSX.read(new Uint8Array(x.target.result),{type:'array'});
const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
data=rows.slice(1).map(r=>({en:r[1],nl:r[2]}));
document.getElementById('go-btn').disabled=false;
};
r.readAsArrayBuffer(f);
}

/* NAV */
function showScreen(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active-screen'));
document.getElementById(id).classList.add('active-screen');
}

function goMode(){showScreen('screen-mode')}

function enterMode(m){
mode=m;i=0;
showScreen(m==='chat'?'screen-chat':'screen-quiz');
if(m==='chat')nextChat();else nextQuiz();
}

/* CHAT */
function nextChat(){
if(i>=data.length)return;
const w=data[i];
addMsg('bot',"Translate: "+w.en);
setTimeout(()=>document.getElementById('chat-in').focus(),100);
}

function submitChat(){
const inp=document.getElementById('chat-in');
const val=inp.value.trim();
if(!val)return;

const w=data[i];
addMsg('user',val);

if(val.toLowerCase()===w.nl.toLowerCase()){
addMsg('correct-msg',"Correct");
}else{
addMsg('wrong-msg',"Ans: "+w.nl);
}
i++;
inp.value='';
nextChat();
}

function addMsg(cls,txt){
const d=document.createElement('div');
d.className="msg "+cls;
d.innerText=txt;
const win=document.getElementById('chat-window');
win.appendChild(d);
win.scrollTop=win.scrollHeight;
}

/* QUIZ */
function nextQuiz(){
if(i>=data.length)return;
const w=data[i];
document.getElementById('quiz-q').innerText=w.en;

const opts=[w.nl,...genWrong(w.nl)];
shuffle(opts);

const div=document.getElementById('quiz-options');
div.innerHTML='';
opts.forEach(o=>{
const b=document.createElement('button');
b.className='quiz-opt';
b.innerText=o;
b.onclick=()=>ans(b,o,w);
div.appendChild(b);
});
}

function ans(btn,o,w){
const all=document.querySelectorAll('.quiz-opt');
all.forEach(b=>b.disabled=true);

if(o===w.nl){
btn.classList.add('correct');
}else{
btn.classList.add('wrong');
all.forEach(b=>{if(b.innerText===w.nl)b.classList.add('correct')});
}
i++;
setTimeout(nextQuiz,1200);
}

/* HARD OPTIONS */
function genWrong(correct){
const set=new Set();
while(set.size<3){
set.add(mutate(correct));
}
return [...set];
}

function mutate(w){
let a=w.split('');
const t=Math.floor(Math.random()*5);

if(t===0){let i=rand(a.length),j=rand(a.length);[a[i],a[j]]=[a[j],a[i]];}
if(t===1){a.splice(rand(a.length),0,randChar());}
if(t===2 && a.length>3){a.splice(rand(a.length),1);}
if(t===3){a[rand(a.length)]=randChar();}
if(t===4){let x=rand(a.length);a.splice(x,0,a[x]);}

return a.join('');
}

function rand(n){return Math.floor(Math.random()*n)}
function randChar(){return "abcdefghijklmnopqrstuvwxyz"[rand(26)]}

function shuffle(a){
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
}

/* iOS KEYBOARD FIX */
if(window.visualViewport){
window.visualViewport.addEventListener('resize',()=>{
document.body.style.height=window.visualViewport.height+"px";
});
}

/* auto scroll */
document.getElementById('chat-in').addEventListener('focus',()=>{
setTimeout(()=>{
const w=document.getElementById('chat-window');
w.scrollTop=w.scrollHeight;
},300);
});
</script>

</body>
</html>
