<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>Dutch Mastery Elite</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { 
            --orange: #ff9800; --blue: #2196f3; --bg: #ffffff; 
            --green: #4caf50; --red: #f44336; --gray: #f0f2f5; 
            --text: #333;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { 
            width: 100%; height: 100%; margin: 0; padding: 0; 
            background-color: var(--bg); overflow: hidden; 
            position: fixed; font-family: -apple-system, sans-serif;
        }

        #app-wrapper {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; padding-top: env(safe-area-inset-top);
        }

        .screen { flex: 1; width: 100%; display: none; flex-direction: column; padding: 0 20px; overflow: hidden; }
        .active-screen { display: flex; }

        .nav-header { width: 100%; height: 60px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .back-btn { background: #e3f2fd; color: var(--blue); border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; }

        /* Chapter State Colors */
        .chap-box { 
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center; 
            border: 2px solid #eee; border-radius: 12px; font-weight: bold; font-size: 1.2rem;
            transition: all 0.3s;
        }
        .status-inprogress { border-color: var(--orange) !important; background: #fff3e0; color: var(--orange); }
        .status-retry { border-color: var(--red) !important; background: #ffebee; color: var(--red); }
        .status-completed { border-color: var(--green) !important; background: #e8f5e9; color: var(--green); }

        #chapter-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; overflow-y: auto; padding-bottom: 20px; }

        /* Progress Bar */
        .progress-container { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
        .prog-track { flex: 1; height: 8px; background: #eee; border-radius: 4px; display: flex; overflow: hidden; }
        .prog-bit { flex: 1; height: 100%; background: #ddd; }
        .prog-bit.active { background: var(--orange); }

        #chat-window { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px 0; }
        .msg { padding: 12px; border-radius: 15px; max-width: 80%; font-size: 16px; }
        .bot { align-self: flex-start; background: var(--gray); }
        .user { align-self: flex-end; background: var(--blue); color: white; }
        .err-msg { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }

        .chat-input-area { padding: 10px 0; display: flex; gap: 10px; border-top: 1px solid #eee; margin-bottom: env(safe-area-inset-bottom); }
        .chat-input-area input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        
        .btn { padding: 15px; border-radius: 10px; border: 1px solid #ddd; background: white; font-weight: bold; }
        .primary { background: var(--blue); color: white; border: none; }
    </style>
</head>
<body>

<div id="app-wrapper">
    <!-- SETUP -->
    <div id="screen-setup" class="screen active-screen" style="justify-content: center;">
        <h2 style="text-align:center">Dutch Mastery</h2>
        <input type="file" id="file-input" accept=".xlsx" style="margin-bottom:20px" onchange="loadData()">
        <div id="mode-zone" style="display:none; flex-direction:column; gap:10px;">
            <button class="btn" id="btn-chat" onclick="setMode('chat')">💬 Chat Mode</button>
            <button class="btn" id="btn-quiz" onclick="setMode('quiz')">🔘 Quiz Mode</button>
            <button class="btn primary" onclick="showChapters()">Go to Chapters</button>
        </div>
    </div>

    <!-- CHAPTERS -->
    <div id="screen-chapters" class="screen">
        <div class="nav-header">
            <button class="back-btn" onclick="showScreen('screen-setup')">⇠ Back</button>
            <b id="display-mode"></b>
        </div>
        <h3>Chapters</h3>
        <div id="chapter-list"></div>
    </div>

    <!-- CHAT -->
    <div id="screen-chat" class="screen">
        <div class="nav-header"><button class="back-btn" onclick="exitSession()">⇠ Chapters</button></div>
        <div id="chat-prog" class="progress-container"></div>
        <div id="chat-window"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-in" placeholder="Type Dutch...">
            <button class="btn primary" onclick="handleChatSubmit()">➔</button>
        </div>
    </div>

    <!-- QUIZ -->
    <div id="screen-quiz" class="screen">
        <div class="nav-header"><button class="back-btn" onclick="exitSession()">⇠ Chapters</button></div>
        <div id="quiz-prog" class="progress-container"></div>
        <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;">
            <h1 id="quiz-q"></h1>
            <div id="quiz-options" style="width:100%; display:grid; gap:10px;"></div>
        </div>
    </div>
</div>

<script>
    let masterData = [], currentPool = [], retryQueue = [];
    let appMode = 'chat', currentIndex = 0, activeChapterIdx = 0;
    let progressMap = { chat: {}, quiz: {} }; 

    // Initial user interaction to unlock Audio
    function unlockAudio() {
        const silent = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(silent);
    }

    function speak(text) {
        window.speechSynthesis.cancel(); // Stop any current speech
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'nl-NL';
        msg.rate = 0.85;
        window.speechSynthesis.speak(msg);
    }

    function loadData() {
        const file = document.getElementById('file-input').files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            const wb = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
            masterData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1})
                .slice(1).filter(r => r[1] && r[2]).map(r => ({en: r[1], nl: r[2]}));
            document.getElementById('mode-zone').style.display = 'flex';
        };
        reader.readAsArrayBuffer(file);
    }

    function setMode(m) {
        appMode = m;
        document.getElementById('btn-chat').style.borderColor = m==='chat'?'#2196f3':'#ddd';
        document.getElementById('btn-quiz').style.borderColor = m==='quiz'?'#2196f3':'#ddd';
    }

    function showChapters() {
        unlockAudio();
        document.getElementById('display-mode').innerText = appMode.toUpperCase();
        const list = document.getElementById('chapter-list');
        list.innerHTML = '';
        const total = Math.ceil(masterData.length / 50);
        
        for(let i=0; i<total; i++) {
            const div = document.createElement('div');
            const state = progressMap[appMode][i] || ''; // 'inprogress', 'retry', 'completed'
            div.className = `chap-box status-${state}`;
            div.innerText = i + 1;
            div.onclick = () => startSession(i);
            list.appendChild(div);
        }
        showScreen('screen-chapters');
    }

    function startSession(idx) {
        activeChapterIdx = idx;
        currentPool = masterData.slice(idx * 50, (idx + 1) * 50);
        retryQueue = [];
        currentIndex = 0;
        if(!progressMap[appMode][idx]) progressMap[appMode][idx] = 'inprogress';
        
        if(appMode === 'chat') {
            document.getElementById('chat-window').innerHTML = '';
            showScreen('screen-chat');
            nextChat();
        } else {
            showScreen('screen-quiz');
            nextQuiz();
        }
    }

    function nextQuiz() {
        if(currentIndex >= currentPool.length) return endRound();
        const word = currentPool[currentIndex];
        updateProgress('quiz-prog');
        document.getElementById('quiz-q').innerText = word.en;
        const optsDiv = document.getElementById('quiz-options');
        optsDiv.innerHTML = '';
        
        const options = [word.nl, ...generateWrong(word.nl)].sort(() => Math.random() - 0.5);
        options.forEach(o => {
            const b = document.createElement('button');
            b.className = 'btn';
            b.innerText = o;
            b.onclick = () => {
                const correct = o === word.nl;
                b.style.background = correct ? 'var(--green)' : 'var(--red)';
                b.style.color = 'white';
                speak(word.nl);
                if(!correct) {
                    retryQueue.push(word);
                    progressMap[appMode][activeChapterIdx] = 'retry';
                }
                setTimeout(() => { currentIndex++; nextQuiz(); }, 1000);
            };
            optsDiv.appendChild(b);
        });
    }

    function nextChat() {
        if(currentIndex >= currentPool.length) return endRound();
        updateProgress('chat-prog');
        const win = document.getElementById('chat-window');
        win.innerHTML += `<div class="msg bot">Translate: "<b>${currentPool[currentIndex].en}</b>"</div>`;
        win.scrollTop = win.scrollHeight;
    }

    function handleChatSubmit() {
        const inp = document.getElementById('chat-in');
        const val = inp.value.trim();
        if(!val) return;
        const word = currentPool[currentIndex];
        const correct = val.toLowerCase() === word.nl.toLowerCase();
        
        const win = document.getElementById('chat-window');
        win.innerHTML += `<div class="msg user">${val}</div>`;
        speak(word.nl);
        
        if(correct) {
            win.innerHTML += `<div class="msg bot">✅ Correct!</div>`;
        } else {
            win.innerHTML += `<div class="msg bot err-msg">❌ Answer: ${word.nl}</div>`;
            retryQueue.push(word);
            progressMap[appMode][activeChapterIdx] = 'retry';
        }
        
        inp.value = '';
        currentIndex++;
        win.scrollTop = win.scrollHeight;
        setTimeout(nextChat, 1200);
    }

    function endRound() {
        if(retryQueue.length > 0) {
            alert(`Round Over! Starting retry round for ${retryQueue.length} errors.`);
            currentPool = [...retryQueue];
            retryQueue = [];
            currentIndex = 0;
            if(appMode === 'chat') {
                document.getElementById('chat-window').innerHTML += `<div style="text-align:center; color:red; padding:10px;">RETRY ROUND</div>`;
                nextChat();
            } else {
                nextQuiz();
            }
        } else {
            progressMap[appMode][activeChapterIdx] = 'completed';
            alert("Chapter Mastered!");
            showChapters();
        }
    }

    function updateProgress(id) {
        const el = document.getElementById(id);
        const total = currentPool.length;
        el.innerHTML = `<span>${currentIndex+1}/${total}</span><div class="prog-track" id="${id}-t"></div>`;
        const t = document.getElementById(id+'-t');
        for(let i=0; i<total; i++) {
            const b = document.createElement('div');
            b.className = `prog-bit ${i <= currentIndex ? 'active' : ''}`;
            t.appendChild(b);
        }
    }

    function generateWrong(c) {
        let w = new Set();
        while(w.size < 3) {
            let m = c.split('').sort(() => Math.random()-0.5).join('');
            if(m !== c) w.add(m);
            else w.add(c + 'e'); 
        }
        return Array.from(w);
    }

    function exitSession() { showChapters(); }
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(id).classList.add('active-screen');
    }
</script>
</body>
</html>
