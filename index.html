<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>Dutch Mastery Elite</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --orange: #ff4f00; --blue: #4b63ff; --bg: #ffffff; --green: #2db162; --red: #ea5936; --gray-light: #f0f2f5; --text: #3c3c3c; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); color: var(--text); overflow: hidden; }
        
        .screen { position: absolute; inset: 0; background: white; z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 25px; }
        .active-screen { display: flex; }

        /* Progress Bar Styling */
        .progress-header { width: 100%; max-width: 800px; display: flex; align-items: center; gap: 10px; margin-bottom: 40px; padding: 0 20px; }
        .prog-seg-container { flex: 1; display: flex; gap: 6px; }
        .prog-seg { flex: 1; height: 12px; background: #e5e5e5; border-radius: 10px; overflow: hidden; }
        .prog-fill { height: 100%; background: #e5e5e5; transition: width 0.4s cubic-bezier(0.65, 0, 0.35, 1); }
        .prog-fill.active { background: var(--orange); }
        .count-circle { width: 30px; height: 30px; background: var(--orange); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }

        /* Card Design */
        .quiz-container { width: 90%; max-width: 700px; border: 2px solid #e5e5e5; border-radius: 20px; padding: 40px; position: relative; }
        .def-label { color: #afafaf; font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 5px; margin-bottom: 20px; }
        .q-word { font-size: 32px; font-weight: 500; margin-bottom: 60px; text-align: left; }

        /* Options Grid */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .opt-btn { width: 100%; padding: 20px; border: 2px solid #e5e5e5; border-radius: 15px; background: white; font-size: 18px; color: #4b4b4b; cursor: pointer; text-align: left; display: flex; align-items: center; transition: all 0.2s; position: relative; }
        .opt-btn:hover { background: #f7f7f7; }
        .opt-num { color: #afafaf; margin-right: 15px; font-size: 14px; border: 1px solid #e5e5e5; padding: 2px 6px; border-radius: 4px; }
        
        /* Feedback States */
        .opt-btn.correct { border-color: var(--green); background: #e8f5e9; color: var(--green); font-weight: bold; }
        .opt-btn.correct::before { content: '✓'; margin-right: 10px; font-size: 20px; }
        .opt-btn.wrong { border-color: var(--red); background: #fdf2f0; color: var(--red); font-weight: bold; }
        .opt-btn.wrong::before { content: '✕'; margin-right: 10px; font-size: 20px; }

        .footer-text { margin-top: 40px; color: #777; font-size: 14px; }
        
        /* Setup UI */
        .btn { width: 100%; max-width: 300px; padding: 15px; margin: 8px 0; border: 2px solid #eee; border-radius: 12px; background: white; font-weight: bold; cursor: pointer; }
        .primary-btn { background: var(--blue); color: white; border: none; }
        #chapter-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .chap-item { padding: 15px; border: 1px solid #ddd; border-radius: 10px; cursor: pointer; }
        .chap-item.done { background: var(--green); color: white; border-color: var(--green); }
    </style>
</head>
<body>

<div id="app-wrapper">
    <!-- SETUP SCREEN -->
    <div id="screen-setup" class="screen active-screen">
        <h1 style="color:var(--blue)">Dutch Mastery</h1>
        <input type="file" id="file-input" accept=".xlsx, .csv" style="margin: 20px 0;">
        <div style="display:flex; gap:10px;">
            <button class="btn" id="m-chat" onclick="setMode('chat')">Chat Mode</button>
            <button class="btn" style="border-color:var(--blue)" id="m-quiz" onclick="setMode('quiz')">Quiz Mode</button>
        </div>
        <button class="btn primary-btn" onclick="loadChapters()">Enter Classroom</button>
    </div>

    <!-- CHAPTER SCREEN -->
    <div id="screen-chapters" class="screen">
        <h2>Select a Chapter</h2>
        <div id="chapter-list"></div>
    </div>

    <!-- PRACTICE SCREEN -->
    <div id="screen-practice" class="screen">
        <div class="progress-header">
            <div class="count-circle" id="count-left">0</div>
            <div class="prog-seg-container" id="prog-seg-container"></div>
            <div class="count-circle" style="background:#e5e5e5; color:#777;" id="count-total">0</div>
        </div>

        <div class="quiz-container">
            <div class="def-label">Definition <span style="font-size:18px">🔊</span></div>
            <div id="q-text" class="q-word">...</div>
            <div class="options-grid" id="options-grid"></div>
        </div>

        <div class="footer-text">Click the correct answer to continue</div>
    </div>

    <!-- MASTERY SCREEN -->
    <div id="screen-mastery" class="screen">
        <h1 id="mastery-msg">Chapter Finished!</h1>
        <button class="btn primary-btn" id="retry-btn" onclick="retryMistakes()">Review Mistakes</button>
        <button class="btn" onclick="showChapters()">Back to Chapters</button>
    </div>
</div>

<script>
    let masterList = [], currentPool = [], wrongAnswers = [], completedChapters = new Set();
    let appMode = 'quiz', currentIndex = 0, currentWord = null, isLocked = false, activeChapterId = -1;

    function setMode(m) {
        appMode = m;
        document.getElementById('m-chat').style.borderColor = m === 'chat' ? 'var(--blue)' : '#eee';
        document.getElementById('m-quiz').style.borderColor = m === 'quiz' ? 'var(--blue)' : '#eee';
    }

    async function loadChapters() {
        const file = document.getElementById('file-input').files[0];
        if (!file) return alert("Select a file first.");
        const data = await file.arrayBuffer();
        const wb = XLSX.read(data);
        masterList = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1})
            .slice(1).filter(r => r[1] && r[2]).map(r => ({en: String(r[1]).trim(), nl: String(r[2]).trim()}));
        showChapters();
    }

    function showChapters() {
        const container = document.getElementById('chapter-list');
        container.innerHTML = '';
        const total = Math.ceil(masterList.length / 50);
        for(let i=0; i<total; i++) {
            const div = document.createElement('div');
            div.className = 'chap-item' + (completedChapters.has(i) ? ' done' : '');
            div.innerText = i + 1;
            div.onclick = () => startSession(masterList.slice(i*50, (i+1)*50), i);
            container.appendChild(div);
        }
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById('screen-chapters').classList.add('active-screen');
    }

    function startSession(words, id) {
        currentPool = [...words];
        wrongAnswers = [];
        currentIndex = 0;
        activeChapterId = id;
        setupProgress();
        nextQuestion();
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById('screen-practice').classList.add('active-screen');
    }

    function setupProgress() {
        const container = document.getElementById('prog-seg-container');
        container.innerHTML = '';
        document.getElementById('count-total').innerText = currentPool.length;
        for(let i=0; i<currentPool.length; i++) {
            const seg = document.createElement('div');
            seg.className = 'prog-seg';
            seg.innerHTML = `<div class="prog-fill" id="fill-${i}"></div>`;
            container.appendChild(seg);
        }
    }

    function nextQuestion() {
        if (currentIndex >= currentPool.length) return endSession();
        
        isLocked = false;
        currentWord = currentPool[currentIndex];
        document.getElementById('q-text').innerText = currentWord.en;
        document.getElementById('count-left').innerText = currentIndex + 1;

        // Update progress bar
        for(let i=0; i<=currentIndex; i++) {
            const f = document.getElementById(`fill-${i}`);
            if(f) f.style.width = '100%';
            if(f) f.classList.add('active');
        }

        const grid = document.getElementById('options-grid');
        grid.innerHTML = '';

        let opts = [currentWord.nl];
        while(opts.length < 4) {
            let dist = mutate(currentWord.nl);
            if(!opts.includes(dist)) opts.push(dist);
        }
        opts.sort(() => Math.random() - 0.5);

        opts.forEach((o, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerHTML = `<span class="opt-num">${i+1}</span> ${o}`;
            b.onclick = () => checkAnswer(b, o);
            grid.appendChild(b);
        });
    }

    function checkAnswer(btn, choice) {
        if(isLocked) return;
        isLocked = true;
        const isCorrect = choice === currentWord.nl;
        
        speak(currentWord.nl);

        if(isCorrect) {
            btn.classList.add('correct');
        } else {
            btn.classList.add('wrong');
            wrongAnswers.push(currentWord);
            Array.from(document.getElementById('options-grid').children).forEach(cb => {
                if(cb.innerText.includes(currentWord.nl)) cb.classList.add('correct');
            });
        }

        setTimeout(() => {
            currentIndex++;
            nextQuestion();
        }, 1500);
    }

    function mutate(word) {
        let arr = word.split('');
        let idx = Math.floor(Math.random() * arr.length);
        let type = Math.floor(Math.random() * 2);
        if(type === 0) arr[idx] = 'aeiou'.charAt(Math.floor(Math.random()*5));
        else arr.splice(idx, 0, arr[idx]);
        let res = arr.join('');
        return res === word ? mutate(word) : res;
    }

    function speak(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t); m.lang = 'nl-NL';
        window.speechSynthesis.speak(m);
    }

    function endSession() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById('screen-mastery').classList.add('active-screen');
        const msg = document.getElementById('mastery-msg');
        const retry = document.getElementById('retry-btn');

        if(wrongAnswers.length === 0) {
            msg.innerText = "100% Mastery Achieved!";
            completedChapters.add(activeChapterId);
            retry.style.display = 'none';
        } else {
            msg.innerText = `Keep practicing! You missed ${wrongAnswers.length} words.`;
            retry.style.display = 'block';
        }
    }

    function retryMistakes() {
        startSession(wrongAnswers, activeChapterId);
    }
</script>
</body>
</html>
