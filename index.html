<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>Dutch Mastery Elite</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { 
            --orange: #ff4f00; --blue: #4b63ff; --bg: #ffffff; 
            --green: #2db162; --red: #ea5936; --gray-light: #f0f2f5; 
            --text: #3c3c3c; --blue-light: #e8f0fe;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* CRITICAL: Prevents iOS from scrolling the whole page */
        html, body { 
            width: 100%; height: 100%; margin: 0; padding: 0; 
            font-family: -apple-system, system-ui, sans-serif; 
            background-color: var(--bg); overflow: hidden; 
            position: fixed; touch-action: none; 
        }
        
        #app-wrapper {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; background: white;
            padding-top: env(safe-area-inset-top);
        }

        .screen { 
            flex: 1; width: 100%; display: none; flex-direction: column; 
            padding: 0 20px; overflow: hidden;
        }
        .active-screen { display: flex; }

        /* UI ELEMENTS FROM IMAGE_2.PNG */
        .nav-header { width: 100%; height: 50px; display: flex; align-items: center; flex-shrink: 0; }
        .back-btn { 
            background: var(--blue-light); color: var(--blue); border: none; 
            padding: 6px 14px; border-radius: 8px; font-weight: bold; font-size: 14px;
        }

        .progress-container { 
            width: 100%; display: flex; align-items: center; gap: 8px; 
            margin: 5px 0 15px 0; height: 30px; flex-shrink: 0; 
        }
        .num-circle { 
            width: 26px; height: 26px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-size: 11px; font-weight: bold;
        }
        .num-circle.start { background: var(--orange); color: white; }
        .num-circle.end { background: #eee; color: #aaa; }
        
        .prog-track { flex: 1; height: 6px; background: #eee; border-radius: 10px; display: flex; gap: 2px; }
        .prog-bit { flex: 1; height: 100%; background: #eee; border-radius: 10px; }
        .prog-bit.active { background: var(--orange); }

        /* CHAT WINDOW */
        #chat-window { 
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; 
            gap: 12px; padding: 10px 0; touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }
        .msg { padding: 10px 16px; border-radius: 18px; max-width: 80%; font-size: 16px; }
        .bot { align-self: flex-start; background: var(--gray-light); }
        .user { align-self: flex-end; background: var(--blue); color: white; }
        .err-msg { align-self: flex-start; background: #fff1f0; border: 1px solid #ffccc7; color: #cf1322; }

        /* INPUT AREA PINNED TO KEYBOARD */
        .chat-input-area { 
            width: 100%; background: white; border-top: 1px solid #eee;
            padding: 10px 0; display: flex; gap: 10px; align-items: center; flex-shrink: 0;
            margin-bottom: env(safe-area-inset-bottom);
        }
        .chat-input-area input { 
            flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid #ddd; 
            font-size: 16px; outline: none; background: #fdfdfd;
        }
        .send-btn { 
            background: var(--blue); color: white; border: none; 
            width: 40px; height: 40px; border-radius: 50%; font-size: 16px;
        }

        /* CHAPTERS GRID */
        #chapter-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; overflow-y: auto; touch-action: pan-y; }
        .chap-box { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border: 2px solid #eee; border-radius: 15px; font-weight: bold; }
        .chap-box.done { background: var(--green); color: white; border-color: var(--green); }
        .chap-box.error { background: var(--red); color: white; border-color: var(--red); }
        .chap-box.pending { border-color: var(--orange); color: var(--orange); }

        .btn { width: 100%; padding: 16px; border-radius: 12px; font-weight: bold; border: 1px solid #eee; font-size: 16px; }
        .primary { background: var(--blue); color: white; border: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-wrapper">
    <!-- SETUP -->
    <div id="screen-setup" class="screen active-screen" style="justify-content: center; align-items: center;">
        <h1 style="color:var(--blue)">🇳🇱 Dutch Mastery</h1>
        <input type="file" id="file-input" accept=".xlsx, .csv" style="margin-bottom: 20px;">
        <button class="btn primary" onclick="loadData()">Load File</button>
        <div id="mode-zone" class="hidden" style="margin-top:20px; width:100%; text-align:center;">
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <button class="btn" id="btn-chat" onclick="setMode('chat')">💬 Chat</button>
                <button class="btn" id="btn-quiz" onclick="setMode('quiz')">🔘 Quiz</button>
            </div>
            <button class="btn primary" onclick="goToChapters()">Continue</button>
        </div>
    </div>

    <!-- CHAPTERS -->
    <div id="screen-chapters" class="screen">
        <div class="nav-header"><button class="back-btn" onclick="showScreen('screen-setup')">⇠ Menu</button></div>
        <h2>Chapters</h2>
        <div id="chapter-list"></div>
    </div>

    <!-- CHAT -->
    <div id="screen-chat" class="screen">
        <div class="nav-header"><button class="back-btn" onclick="goToChapters()">⇠ Back</button></div>
        <div class="progress-container" id="chat-progress-ui"></div>
        <div id="chat-window"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-in" placeholder="Type Dutch..." autocomplete="off">
            <button class="send-btn" onclick="handleChatSubmit()">➔</button>
        </div>
    </div>

    <!-- QUIZ -->
    <div id="screen-quiz" class="screen">
        <div class="nav-header"><button class="back-btn" onclick="goToChapters()">⇠ Back</button></div>
        <div class="progress-container" id="quiz-progress-ui"></div>
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <h2 id="quiz-q" style="font-size: 32px; margin-bottom: 40px;">...</h2>
            <div id="quiz-options" style="width: 100%; display: grid; gap: 10px;"></div>
        </div>
    </div>
</div>

<script>
    let masterList = [], currentPool = [], wrongAnswers = [], chatStatus = {}, quizStatus = {}; 
    let appMode = 'chat', currentIndex = 0, currentWord = null, isLocked = false, activeChapterId = -1;

    // KEYBOARD FIX: Locks the screen height to the visible viewport
    const vp = window.visualViewport;
    function syncViewport() {
        const wrapper = document.getElementById('app-wrapper');
        // Subtract the offset to prevent the address bar from pushing content
        wrapper.style.height = `${vp.height}px`;
        wrapper.style.top = `${vp.offsetTop}px`;
        
        if (document.getElementById('screen-chat').classList.contains('active-screen')) {
            const win = document.getElementById('chat-window');
            win.scrollTop = win.scrollHeight;
        }
    }
    vp.addEventListener('resize', syncViewport);
    vp.addEventListener('scroll', syncViewport);

    document.getElementById('chat-in').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleChatSubmit(); });

    async function loadData() {
        const file = document.getElementById('file-input').files[0];
        if (!file) return;
        const data = await file.arrayBuffer();
        const wb = XLSX.read(data);
        masterList = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1})
            .slice(1).filter(r => r[1] && r[2]).map(r => ({en: String(r[1]).trim(), nl: String(r[2]).trim()}));
        document.getElementById('mode-zone').classList.remove('hidden');
        setMode('chat');
    }

    function setMode(m) {
        appMode = m;
        document.getElementById('btn-chat').style.background = m === 'chat' ? 'var(--blue-light)' : 'white';
        document.getElementById('btn-quiz').style.background = m === 'quiz' ? 'var(--blue-light)' : 'white';
    }

    function goToChapters() {
        const container = document.getElementById('chapter-list');
        container.innerHTML = '';
        const total = Math.ceil(masterList.length / 50);
        const map = appMode === 'chat' ? chatStatus : quizStatus;
        for(let i=0; i<total; i++) {
            const div = document.createElement('div');
            div.className = `chap-box ${map[i] || ''}`;
            div.innerText = i + 1;
            div.onclick = () => startSession(masterList.slice(i*50, (i+1)*50), i);
            container.appendChild(div);
        }
        showScreen('screen-chapters');
    }

    function startSession(words, id) {
        currentPool = [...words]; wrongAnswers = []; currentIndex = 0; activeChapterId = id;
        if(appMode === 'chat') { 
            document.getElementById('chat-window').innerHTML = ''; 
            showScreen('screen-chat'); nextChat(); 
        } else { 
            showScreen('screen-quiz'); nextQuiz(); 
        }
    }

    function renderProgress() {
        const target = appMode === 'chat' ? 'chat-progress-ui' : 'quiz-progress-ui';
        const ui = document.getElementById(target);
        ui.innerHTML = `<div class="num-circle start">${currentIndex + 1}</div><div class="prog-track" id="${appMode}-bar"></div><div class="num-circle end">${currentPool.length}</div>`;
        const bar = document.getElementById(`${appMode}-bar`);
        for(let i=0; i<currentPool.length; i++) {
            const b = document.createElement('div');
            b.className = `prog-bit ${i <= currentIndex ? 'active' : ''}`;
            bar.appendChild(b);
        }
    }

    function nextChat() {
        if (currentIndex >= currentPool.length) return finish();
        currentWord = currentPool[currentIndex]; isLocked = false;
        renderProgress();
        const win = document.getElementById('chat-window');
        const m = document.createElement('div'); m.className = 'msg bot';
        m.innerText = `Translate: "${currentWord.en}"`;
        win.appendChild(m); win.scrollTop = win.scrollHeight;
    }

    function handleChatSubmit() {
        const inp = document.getElementById('chat-in');
        if (!inp.value || isLocked) return;
        isLocked = true;
        const val = inp.value.trim();
        const win = document.getElementById('chat-window');
        
        const userMsg = document.createElement('div'); userMsg.className = 'msg user'; userMsg.innerText = val;
        win.appendChild(userMsg);

        const botMsg = document.createElement('div');
        if(val.toLowerCase() === currentWord.nl.toLowerCase()) {
            botMsg.className = 'msg bot'; botMsg.innerText = "✅ Correct!";
        } else {
            wrongAnswers.push(currentWord);
            botMsg.className = 'msg bot err-msg'; 
            botMsg.innerHTML = `❌ Answer: <b>${currentWord.nl}</b>`;
        }
        win.appendChild(botMsg);
        win.scrollTop = win.scrollHeight;
        
        speak(currentWord.nl);
        inp.value = '';
        setTimeout(() => { currentIndex++; nextChat(); }, 1000);
    }

    function nextQuiz() {
        if (currentIndex >= currentPool.length) return finish();
        currentWord = currentPool[currentIndex]; isLocked = false;
        renderProgress();
        document.getElementById('quiz-q').innerText = currentWord.en;
        const grid = document.getElementById('quiz-options'); grid.innerHTML = '';
        let opts = [currentWord.nl];
        while(opts.length < 4) {
            let f = masterList[Math.floor(Math.random()*masterList.length)].nl;
            if(!opts.includes(f)) opts.push(f);
        }
        opts.sort(() => Math.random() - 0.5).forEach(o => {
            const b = document.createElement('button'); b.className = 'btn'; b.innerText = o;
            b.onclick = () => {
                if(isLocked) return; isLocked = true;
                speak(currentWord.nl);
                b.style.borderColor = o === currentWord.nl ? 'var(--green)' : 'var(--red)';
                if(o !== currentWord.nl) wrongAnswers.push(currentWord);
                setTimeout(() => { currentIndex++; nextQuiz(); }, 1000);
            };
            grid.appendChild(b);
        });
    }

    function finish() {
        const res = wrongAnswers.length === 0 ? 'done' : 'error';
        if(appMode === 'chat') chatStatus[activeChapterId] = res; else quizStatus[activeChapterId] = res;
        goToChapters();
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(id).classList.add('active-screen');
        syncViewport();
    }

    function speak(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'nl-NL'; window.speechSynthesis.speak(m);
    }
</script>
</body>
</html>
