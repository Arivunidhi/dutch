<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Dutch Learner Pro</title>
    <!-- Include SheetJS library to read Excel files -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --dutch-orange: #ff4f00; --dutch-blue: #21468b; --bg: #f0f2f5; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; height: 100vh; box-sizing: border-box; }
        .setup-box, .chat-container { width: 95%; max-width: 420px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .setup-box { padding: 30px 20px; margin-top: 20px; text-align: center; border-top: 6px solid var(--dutch-orange); }
        .chat-container { height: 90vh; display: none; flex-direction: column; overflow: hidden; margin-top: 10px; }
        .chat-header { background: var(--dutch-orange); color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chat-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #f9f9f9; }
        .message { max-width: 85%; padding: 12px; border-radius: 18px; font-size: 16px; line-height: 1.4; }
        .bot { align-self: flex-start; background: #e9e9eb; }
        .user { align-self: flex-end; background: var(--dutch-blue); color: white; }
        .input-area { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; background: white; padding-bottom: 30px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 25px; font-size: 16px; outline: none; }
        button { cursor: pointer; background: var(--dutch-orange); color: white; border: none; padding: 12px 20px; border-radius: 25px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

<div class="setup-box" id="setup">
    <h2 style="margin-top:0">🇳🇱 Dutch Learner</h2>
    <p>Upload your <b>.xlsx</b> or <b>.csv</b></p>
    <input type="file" id="file-input" accept=".xlsx, .csv">
    <br><br>
    <button onclick="handleFile()">Start Practice</button>
</div>

<div class="chat-container" id="chat-ui">
    <div class="chat-header">Conversational Dutch</div>
    <div id="chat-window"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type here..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    let vocabulary = [];
    let currentWord = null;

    async function handleFile() {
        const fileInput = document.getElementById('file-input');
        const file = fileInput.files[0];
        if (!file) return alert("Please select a file!");

        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data);
        
        // Read the first sheet
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        
        // Convert to JSON (array of arrays)
        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

        // Filter and Map: Ignore header (row 0), get Col 1 (English) and Col 2 (Dutch)
        vocabulary = jsonData.slice(1) 
            .filter(row => row[1] && row[2]) 
            .map(row => ({
                english: String(row[1]).trim(),
                dutch: String(row[2]).trim()
            }));

        if (vocabulary.length > 0) {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('chat-ui').style.display = 'flex';
            addMessage("Hoi! File loaded. Let's start!", 'bot');
            botAsk();
        } else {
            alert("Could not find data. Make sure Column B is English and Column C is Dutch!");
        }
    }

    function addMessage(text, sender) {
        const win = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerText = text;
        win.appendChild(div);
        win.scrollTop = win.scrollHeight;
    }

    function botAsk() {
        currentWord = vocabulary[Math.floor(Math.random() * vocabulary.length)];
        const prompts = [`How do you say "${currentWord.english}"?`, `Translate "${currentWord.english}" to Dutch.`, `What does "${currentWord.dutch}" mean?` ];
        addMessage(prompts[Math.floor(Math.random() * prompts.length)], 'bot');
    }

    function sendMessage() {
        const input = document.getElementById('user-input');
        const val = input.value.trim();
        if(!val) return;

        addMessage(val, 'user');
        input.value = '';

        setTimeout(() => {
            const userVal = val.toLowerCase();
            if (userVal === currentWord.dutch.toLowerCase() || userVal === currentWord.english.toLowerCase()) {
                addMessage("✅ Correct!", 'bot');
            } else {
                addMessage(`Actually, it's "${currentWord.dutch}" (${currentWord.english}).`, 'bot');
            }
            botAsk();
        }, 600);
    }
</script>
</body>
</html>
