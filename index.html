<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>Dutch Mastery Elite</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { 
            --orange: #ff4f00; --blue: #4b63ff; --bg: #ffffff; 
            --green: #2db162; --red: #ea5936; --gray-light: #f0f2f5; 
            --text: #3c3c3c; --safe-top: env(safe-area-inset-top);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { 
            width: 100%; height: 100%; margin: 0; padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg); color: var(--text); 
            overflow: hidden; position: fixed; /* Prevents iOS rubber-band scroll */
        }
        
        .screen { 
            position: absolute; inset: 0; background: white; z-index: 10; 
            display: none; flex-direction: column; align-items: center; 
            padding: calc(var(--safe-top) + 20px) 20px 20px 20px;
        }
        .active-screen { display: flex; }

        /* Centered Alignment for Main Screens */
        .content-center { justify-content: center; text-align: center; }

        /* Progress Header (From scrnli_em4xIV4KDnt83o.png) */
        .progress-header { 
            width: 100%; max-width: 600px; display: flex; 
            align-items: center; gap: 10px; margin-bottom: 25px; 
        }
        .prog-seg-container { flex: 1; display: flex; gap: 4px; }
        .prog-seg { flex: 1; height: 8px; background: #e5e5e5; border-radius: 10px; overflow: hidden; }
        .prog-fill { height: 100%; background: #e5e5e5; transition: width 0.3s; }
        .prog-fill.active { background: var(--orange); }
        .count-circle { 
            width: 28px; height: 28px; background: var(--orange); 
            color: white; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-weight: bold; font-size: 11px; 
        }

        /* Fixed Navigation */
        .nav-header {
            width: 100%; display: flex; align-items: center; 
            justify-content: flex-start; margin-bottom: 20px;
        }
        .nav-back { 
            background: #f0f2f5; border: none; font-size: 18px; 
            padding: 10px 15px; border-radius: 10px; cursor: pointer; color: #555; 
        }

        /* Chapter List Scrollable */
        #chapter-list { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; 
            width: 100%; max-width: 500px; overflow-y: auto; padding: 10px;
            -webkit-overflow-scrolling: touch;
        }
        .chap-item { 
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            border: 2px solid #ddd; border-radius: 12px; font-weight: bold; 
        }
        .chap-item.in-progress { border-color: var(--orange); color: var(--orange); background: #fff8f5; }
        .chap-item.completed { border-color: var(--green); color: white; background: var(--green); }
        .chap-item.has-errors { border-color: var(--red); color: white; background: var(--red); }

        /* Chat Fixed Input Area */
        #chat-window { 
            flex: 1; width: 100%; max-width: 600px; overflow-y: auto; 
            border: 1px solid #eee; border-radius: 15px; padding: 15px; 
            margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px;
            -webkit-overflow-scrolling: touch;
        }
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 85%; font-size: 16px; }
        .bot { align-self: flex-start; background: var(--gray-light); }
        .user { align-self: flex-end; background: var(--blue); color: white; }
        
        .chat-input-area { 
            width: 100%; max-width: 600px; display: flex; gap: 10px; 
            padding-bottom: env(safe-area-inset-bottom);
        }
        .chat-input-area input { 
            flex: 1; padding: 16px; border-radius: 12px; border: 2px solid #eee; 
            font-size: 16px; outline: none; /* Prevents auto-zoom on iOS */
        }

        /* Quiz UI */
        .quiz-card { width: 100%; max-width: 500px; text-align: left; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 25px; }
        .opt-btn { 
            width: 100%; padding: 18px; border: 2px solid #e5e5e5; 
            border-radius: 15px; background: white; font-size: 17px; text-align: left;
        }

        .btn { 
            width: 100%; max-width: 300px; padding: 16px; margin: 8px 0; 
            border: 2px solid #eee; border-radius: 12px; font-weight: bold; font-size: 16px;
        }
        .primary-btn { background: var(--blue); color: white; border: none; }
        .mode-btn.selected { border-color: var(--blue); background: #f0f3ff; color: var(--blue); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-wrapper">
    <!-- SETUP SCREEN -->
    <div id="screen-setup" class="screen active-screen content-center">
        <h1 style="color:var(--blue); margin-bottom: 30px;">🇳🇱 Dutch Mastery</h1>
        <div id="file-upload-section">
            <input type="file" id="file-input" accept=".xlsx, .csv" style="margin-bottom: 20px;">
            <button class="btn primary-btn" onclick="loadData()">Load Vocabulary</button>
        </div>
        <div id="mode-selection" class="hidden">
            <p>File loaded! Choose mode:</p>
            <div style="display:flex; gap:10px; width: 100%; max-width: 320px;">
                <button class="btn mode-btn" id="m-chat" onclick="setMode('chat')">💬 Chat</button>
                <button class="btn mode-btn selected" id="m-quiz" onclick="setMode('quiz')">🔘 Quiz</button>
            </div>
            <button class="btn primary-btn" onclick="goToChapters()" style="margin-top: 20px;">Open Chapters</button>
            <button class="btn" style="color:var(--red); border:none; margin-top: 10px;" onclick="resetFile()">Change File</button>
        </div>
    </div>

    <!-- CHAPTER SCREEN -->
    <div id="screen-chapters" class="screen">
        <div class="nav-header">
            <button class="nav-back" onclick="goToMenu()">⇠ Menu</button>
        </div>
        <h2 id="chap-header" style="margin-top: 0;">Overview</h2>
        <div id="chapter-list"></div>
    </div>

    <!-- CHAT SCREEN -->
    <div id="screen-chat" class="screen">
        <div class="nav-header">
            <button class="nav-back" onclick="goToChapters()">⇠ Back</button>
        </div>
        <div class="progress-header" id="chat-prog"></div>
        <div id="chat-window"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-in" placeholder="Type Dutch..." autocomplete="off" autocorrect="off">
            <button class="btn primary-btn" style="width: auto; margin:0; padding: 0 20px;" onclick="handleChatSubmit()">Send</button>
        </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="screen-quiz" class="screen">
        <div class="nav-header">
            <button class="nav-back" onclick="goToChapters()">⇠ Back</button>
        </div>
        <div class="progress-header" id="quiz-prog"></div>
        <div class="quiz-card">
            <div style="color:#afafaf; font-weight:bold; margin-bottom:10px;">Definition</div>
            <div id="quiz-q-text" style="font-size: 28px; font-weight: 500;">...</div>
            <div class="options-grid" id="quiz-options-grid"></div>
        </div>
    </div>

    <!-- MASTERY SCREEN -->
    <div id="screen-mastery" class="screen content-center">
        <h1 id="mastery-msg">Results</h1>
        <button class="btn primary-btn" id="retry-btn" onclick="retryMistakes()">Retry Mistakes</button>
        <button class="btn" onclick="goToChapters()">Return to Chapters</button>
    </div>
</div>

<script>
    let masterList = [], currentPool = [], wrongAnswers = [];
    let chatStatus = {}, quizStatus = {}; 
    let appMode = 'quiz', currentIndex = 0, currentWord = null, isLocked = false, activeChapterId = -1;

    document.getElementById('chat-in').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleChatSubmit(); });

    function setMode(m) {
        appMode = m;
        document.getElementById('m-chat').classList.toggle('selected', m === 'chat');
        document.getElementById('m-quiz').classList.toggle('selected', m === 'quiz');
    }

    async function loadData() {
        const file = document.getElementById('file-input').files[0];
        if (!file) return alert("Select a file.");
        const data = await file.arrayBuffer();
        const wb = XLSX.read(data);
        masterList = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1})
            .slice(1).filter(r => r[1] && r[2]).map(r => ({en: String(r[1]).trim(), nl: String(r[2]).trim()}));
        document.getElementById('file-upload-section').classList.add('hidden');
        document.getElementById('mode-selection').classList.remove('hidden');
    }

    function goToMenu() { showScreen('screen-setup'); }
    function resetFile() { location.reload(); }

    function goToChapters() {
        const container = document.getElementById('chapter-list');
        container.innerHTML = '';
        document.getElementById('chap-header').innerText = `${appMode.charAt(0).toUpperCase() + appMode.slice(1)} Mode`;
        const total = Math.ceil(masterList.length / 50);
        const statusMap = appMode === 'chat' ? chatStatus : quizStatus;

        for(let i=0; i<total; i++) {
            const div = document.createElement('div');
            const status = statusMap[i] || 'none';
            div.className = `chap-item ${status === 'pending' ? 'in-progress' : status === 'done' ? 'completed' : status === 'error' ? 'has-errors' : ''}`;
            div.innerText = i + 1;
            div.onclick = () => startSession(masterList.slice(i*50, (i+1)*50), i);
            container.appendChild(div);
        }
        showScreen('screen-chapters');
    }

    function startSession(words, id) {
        currentPool = [...words]; wrongAnswers = []; currentIndex = 0; activeChapterId = id;
        if (appMode === 'chat') chatStatus[id] = 'pending'; else quizStatus[id] = 'pending';
        setupProgressUI();
        if(appMode === 'chat') { 
            document.getElementById('chat-window').innerHTML = ''; 
            showScreen('screen-chat'); nextChat(); 
        } else { 
            showScreen('screen-quiz'); nextQuiz(); 
        }
    }

    function setupProgressUI() {
        const target = appMode === 'chat' ? 'chat-prog' : 'quiz-prog';
        const container = document.getElementById(target);
        container.innerHTML = `<div class="count-circle">${currentIndex + 1}</div><div class="prog-seg-container" id="${appMode}-seg-bars"></div><div class="count-circle" style="background:#e5e5e5; color:#777;">${currentPool.length}</div>`;
        const bars = document.getElementById(`${appMode}-seg-bars`);
        for(let i=0; i<currentPool.length; i++) bars.innerHTML += `<div class="prog-seg"><div class="prog-fill" id="${appMode}-fill-${i}"></div></div>`;
    }

    function updateProgressBar() {
        for(let i=0; i<=currentIndex; i++) {
            const f = document.getElementById(`${appMode}-fill-${i}`);
            if(f) { f.style.width = '100%'; f.classList.add('active'); }
        }
        const counts = document.querySelectorAll('.count-circle');
        if(counts[0]) counts[0].innerText = currentIndex + 1;
    }

    function nextChat() {
        if (currentIndex >= currentPool.length) return endSession();
        currentWord = currentPool[currentIndex]; isLocked = false; updateProgressBar();
        const win = document.getElementById('chat-window');
        const botMsg = document.createElement('div'); botMsg.className = 'msg bot';
        botMsg.innerText = `Translate: "${currentWord.en}"`;
        win.appendChild(botMsg); win.scrollTop = win.scrollHeight;
    }

    function handleChatSubmit() {
        const inp = document.getElementById('chat-in');
        if (!inp.value || isLocked) return;
        isLocked = true;
        const val = inp.value.trim();
        const correct = val.toLowerCase() === currentWord.nl.toLowerCase();
        const win = document.getElementById('chat-window');
        const userMsg = document.createElement('div'); userMsg.className = 'msg user'; userMsg.innerText = val; win.appendChild(userMsg);
        
        const botResp = document.createElement('div'); botResp.className = 'msg bot';
        if(correct) botResp.innerHTML = `✅ Correct!`;
        else { wrongAnswers.push(currentWord); botResp.innerHTML = `❌ Incorrect. Correct answer: <b>${currentWord.nl}</b>`; }
        win.appendChild(botResp); win.scrollTop = win.scrollHeight;
        
        speak(currentWord.nl);
        inp.value = '';
        setTimeout(() => { currentIndex++; nextChat(); }, 1600);
    }

    function nextQuiz() {
        if (currentIndex >= currentPool.length) return endSession();
        currentWord = currentPool[currentIndex]; isLocked = false; updateProgressBar();
        document.getElementById('quiz-q-text').innerText = currentWord.en;
        const grid = document.getElementById('quiz-options-grid'); grid.innerHTML = '';
        let opts = [currentWord.nl];
        while(opts.length < 4) {
            let dist = mutate(currentWord.nl);
            if(!opts.includes(dist)) opts.push(dist);
        }
        opts.sort(() => Math.random() - 0.5);
        opts.forEach(o => {
            const b = document.createElement('button'); b.className = 'opt-btn'; b.innerText = o;
            b.onclick = () => {
                if(isLocked) return; isLocked = true; speak(currentWord.nl);
                if(o === currentWord.nl) {
                    b.style.borderColor = 'var(--green)'; b.style.color = 'var(--green)'; b.style.background = '#e8f5e9';
                } else {
                    b.style.borderColor = 'var(--red)'; b.style.color = 'var(--red)'; b.style.background = '#fdf2f0';
                    wrongAnswers.push(currentWord);
                    Array.from(grid.children).forEach(cb => { if(cb.innerText === currentWord.nl) { cb.style.borderColor = 'var(--green)'; cb.style.color = 'var(--green)'; } });
                }
                setTimeout(() => { currentIndex++; nextQuiz(); }, 1500);
            };
            grid.appendChild(b);
        });
    }

    function endSession() {
        showScreen('screen-mastery');
        const res = (wrongAnswers.length === 0) ? 'done' : 'error';
        if (appMode === 'chat') chatStatus[activeChapterId] = res; else quizStatus[activeChapterId] = res;
        
        if(wrongAnswers.length === 0) {
            document.getElementById('mastery-msg').innerText = "Chapter Mastered!";
            document.getElementById('retry-btn').classList.add('hidden');
        } else {
            document.getElementById('mastery-msg').innerText = `You missed ${wrongAnswers.length} words.`;
            document.getElementById('retry-btn').classList.remove('hidden');
        }
    }

    function retryMistakes() { startSession(wrongAnswers, activeChapterId); }
    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen')); document.getElementById(id).classList.add('active-screen'); }
    function speak(t) { window.speechSynthesis.cancel(); const m = new SpeechSynthesisUtterance(t); m.lang = 'nl-NL'; window.speechSynthesis.speak(m); }
    function mutate(w) { let a = w.split(''); let i = Math.floor(Math.random()*a.length); a[i] = 'aeiou'.charAt(Math.floor(Math.random()*5)); return a.join('') === w ? mutate(w) : a.join(''); }
</script>
</body>
</html>
