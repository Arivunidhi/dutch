<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Dutch Learner Pro</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --dutch-orange: #ff4f00; --dutch-blue: #21468b; --bg: #f0f2f5; }
        
        body, html { 
            height: 100%; margin: 0; padding: 0; 
            font-family: -apple-system, sans-serif; background: var(--bg);
            overflow: hidden; /* Prevents whole page from bouncing */
        }

        /* Setup Screen */
        .setup-box { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 400px; background: white; padding: 30px 20px;
            border-radius: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Main App Layout */
        .chat-container { 
            display: none; height: 100%; flex-direction: column; 
            max-width: 500px; margin: 0 auto; background: white;
        }

        /* Stats Bar */
        .stats-bar {
            background: #333; color: white; padding: 10px;
            display: flex; justify-content: space-around; font-size: 14px;
        }

        .chat-header { 
            background: var(--dutch-orange); color: white; padding: 15px; 
            text-align: center; font-weight: bold; 
        }

        /* Scrolling Message Area */
        #chat-window { 
            flex: 1; overflow-y: auto; padding: 15px; 
            display: flex; flex-direction: column; gap: 10px; background: #f9f9f9;
            -webkit-overflow-scrolling: touch;
        }

        /* Suggestion Box */
        #suggestion-box {
            background: #fff9c4; padding: 10px; text-align: center;
            font-style: italic; font-size: 14px; border-bottom: 1px solid #ddd;
        }

        .message { max-width: 85%; padding: 12px; border-radius: 18px; font-size: 16px; }
        .bot { align-self: flex-start; background: #e9e9eb; }
        .user { align-self: flex-end; background: var(--dutch-blue); color: white; }

        /* Input Area (Pinned to Bottom) */
        .input-area { 
            padding: 10px; border-top: 1px solid #eee; 
            display: flex; gap: 8px; background: white;
        }

        input[type="text"] { 
            flex: 1; padding: 12px; border: 1px solid #ccc; 
            border-radius: 25px; font-size: 16px; outline: none;
        }

        button { 
            background: var(--dutch-orange); color: white; border: none; 
            padding: 10px 20px; border-radius: 25px; font-weight: bold; 
        }
    </style>
</head>
<body>

<div class="setup-box" id="setup">
    <h2>🇳🇱 Dutch Learner</h2>
    <p>Upload <b>.xlsx</b> or <b>.csv</b></p>
    <input type="file" id="file-input" accept=".xlsx, .csv" style="width:100%; margin-bottom:20px;">
    <button onclick="handleFile()">Start Practice</button>
</div>

<div class="chat-container" id="chat-ui">
    <div class="chat-header">DUTCH CHAT</div>
    <div class="stats-bar">
        <span>Correct: <b id="stat-correct">0</b></span>
        <span>Wrong: <b id="stat-wrong">0</b></span>
        <span>Total Words: <b id="stat-total">0</b></span>
    </div>
    <div id="suggestion-box">Hint: Start typing to see suggestions...</div>
    <div id="chat-window"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type answer..." autocomplete="off" onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    let vocabulary = [];
    let currentWord = null;
    let stats = { correct: 0, wrong: 0, seen: 0 };

    async function handleFile() {
        const fileInput = document.getElementById('file-input');
        const file = fileInput.files[0];
        if (!file) return alert("Select a file!");

        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data);
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

        vocabulary = jsonData.slice(1)
            .filter(row => row[1] && row[2])
            .map(row => ({
                english: String(row[1]).trim(),
                dutch: String(row[2]).trim()
            }));

        if (vocabulary.length > 0) {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('chat-ui').style.display = 'flex';
            addMessage("Hoi! I'm ready. Use the hint bar if you get stuck!", 'bot');
            botAsk();
        }
    }

    function updateStats() {
        document.getElementById('stat-correct').innerText = stats.correct;
        document.getElementById('stat-wrong').innerText = stats.wrong;
        document.getElementById('stat-total').innerText = stats.seen;
    }

    function addMessage(text, sender) {
        const win = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerText = text;
        win.appendChild(div);
        win.scrollTop = win.scrollHeight;
    }

    function botAsk() {
        currentWord = vocabulary[Math.floor(Math.random() * vocabulary.length)];
        const prompts = [`How do you say "${currentWord.english}"?`, `Translate: ${currentWord.english}`];
        addMessage(prompts[Math.floor(Math.random() * prompts.length)], 'bot');
        
        // Show suggestion
        document.getElementById('suggestion-box').innerText = `Suggestion: It starts with "${currentWord.dutch.substring(0, 2)}..."`;
    }

    function sendMessage() {
        const input = document.getElementById('user-input');
        const val = input.value.trim();
        if(!val) return;

        addMessage(val, 'user');
        input.value = '';
        stats.seen++;

        setTimeout(() => {
            const userVal = val.toLowerCase();
            const correctD = currentWord.dutch.toLowerCase();

            if (userVal === correctD) {
                addMessage("✅ Correct! Goed gedaan.", 'bot');
                stats.correct++;
            } else {
                addMessage(`❌ Incorrect. The word is "${currentWord.dutch}".`, 'bot');
                stats.wrong++;
            }
            updateStats();
            botAsk();
        }, 600);
    }

    // Fix for Mobile Keyboard: adjust view when keyboard appears
    if ('visualViewport' in window) {
        window.visualViewport.addEventListener('resize', () => {
            document.body.style.height = window.visualViewport.height + 'px';
            window.scrollTo(0, 0);
        });
    }
</script>
</body>
</html>
