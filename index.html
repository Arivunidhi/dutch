<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>Dutch Mastery Elite</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { 
            --orange: #ff4f00; --blue: #4b63ff; --bg: #ffffff; 
            --green: #2db162; --red: #ea5936; --gray-light: #f0f2f5; 
            --text: #3c3c3c; --blue-light: #e8f0fe;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { 
            width: 100%; height: 100%; margin: 0; padding: 0; 
            background-color: var(--bg); overflow: hidden !important; 
            position: fixed; left: 0; top: 0; touch-action: none; 
            font-family: -apple-system, system-ui, sans-serif;
        }

        #app-wrapper {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; background: white;
            padding-top: env(safe-area-inset-top);
        }

        .screen { flex: 1; width: 100%; display: none; flex-direction: column; padding: 0 20px; overflow: hidden; }
        .active-screen { display: flex; }

        .nav-header { width: 100%; height: 60px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; border-bottom: 1px solid #eee; }
        .back-btn { background: var(--blue-light); color: var(--blue); border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; }

        .progress-container { width: 100%; display: flex; align-items: center; gap: 8px; margin: 10px 0; height: 30px; flex-shrink: 0; }
        .num-circle { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; }
        .num-circle.start { background: var(--orange); color: white; }
        .num-circle.end { background: #eee; color: #aaa; }
        .prog-track { flex: 1; height: 8px; background: #eee; border-radius: 10px; display: flex; gap: 2px; }
        .prog-bit { flex: 1; height: 100%; background: #eee; border-radius: 4px; }
        .prog-bit.active { background: var(--orange); }

        #chat-window { flex: 1; overflow-y: scroll; display: flex; flex-direction: column; gap: 12px; padding: 15px 0; }
        .msg { padding: 12px 16px; border-radius: 18px; max-width: 85%; font-size: 16px; }
        .bot { align-self: flex-start; background: var(--gray-light); border-bottom-left-radius: 4px; }
        .user { align-self: flex-end; background: var(--blue); color: white; border-bottom-right-radius: 4px; }
        .err-msg { border: 1px solid var(--red); background: #fff1f0; color: var(--red); }

        .chat-input-area { width: 100%; background: white; border-top: 1px solid #eee; padding: 12px 0; display: flex; gap: 10px; flex-shrink: 0; margin-bottom: env(safe-area-inset-bottom); }
        .chat-input-area input { flex: 1; padding: 14px 20px; border-radius: 25px; border: 1px solid #ddd; font-size: 16px; outline: none; }
        
        #chapter-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; overflow-y: scroll; padding-bottom: 30px; }
        .chap-box { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid #eee; border-radius: 16px; font-weight: bold; }
        
        /* STATE COLORS */
        .status-inprogress { border-color: var(--orange); background: #fff7e6; color: var(--orange); }
        .status-retry { border-color: var(--red); background: #fff1f0; color: var(--red); }
        .status-completed { border-color: var(--green); background: #f6ffed; color: var(--green); }

        .btn { width: 100%; padding: 18px; border-radius: 14px; font-weight: bold; border: 1px solid #eee; font-size: 16px; background: white; }
        .primary { background: var(--blue); color: white; border: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-wrapper">
    <!-- SETUP -->
    <div id="screen-setup" class="screen active-screen" style="justify-content: center;">
        <h1 style="text-align: center; color: var(--blue);">🇳🇱 Dutch Mastery</h1>
        <button class="btn primary" onclick="document.getElementById('file-input').click()">📁 Load Dictionary</button>
        <input type="file" id="file-input" accept=".xlsx, .csv" style="display:none" onchange="loadData()">
        
        <div id="mode-selection" class="hidden" style="margin-top: 30px;">
            <button class="btn" id="m-chat" onclick="setMode('chat')">💬 Chat Mode</button>
            <button class="btn" id="m-quiz" onclick="setMode('quiz')" style="margin-top:10px;">🔘 Quiz Mode</button>
            <button class="btn primary" style="margin-top: 20px;" onclick="showChapters()">Enter Chapters</button>
        </div>
    </div>

    <!-- CHAPTERS -->
    <div id="screen-chapters" class="screen">
        <div class="nav-header">
            <button class="back-btn" onclick="showScreen('screen-setup')">⇠ Setup</button>
            <div id="mode-tag" style="font-weight: bold; color: var(--blue);"></div>
        </div>
        <h2 id="chap-heading">Chapters</h2>
        <div id="chapter-list"></div>
    </div>

    <!-- CHAT -->
    <div id="screen-chat" class="screen">
        <div class="nav-header"><button class="back-btn" onclick="confirmExit()">⇠ Exit</button></div>
        <div id="chat-progress-ui" class="progress-container"></div>
        <div id="chat-window"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-in" placeholder="Dutch translation..." autocomplete="off">
            <button class="btn" style="width:50px; padding:0; border-radius:50%; background:var(--blue); color:white;" onclick="handleChatSubmit()">➔</button>
        </div>
    </div>

    <!-- QUIZ -->
    <div id="screen-quiz" class="screen">
        <div class="nav-header"><button class="back-btn" onclick="confirmExit()">⇠ Exit</button></div>
        <div id="quiz-progress-ui" class="progress-container"></div>
        <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
            <h2 id="quiz-q" style="font-size: 32px; text-align: center; margin-bottom: 40px;"></h2>
            <div id="quiz-options" style="display: grid; gap: 12px;"></div>
        </div>
    </div>
</div>

<script>
    let masterList = [], currentPool = [], retryQueue = [];
    let appMode = 'chat', currentIndex = 0, activeChapterIdx = 0;
    
    // Progress Map: { chat: { 0: 'completed', 1: 'retry' }, quiz: {...} }
    let progressMap = { chat: {}, quiz: {} };

    // Layout/Keyboard Freeze
    const vp = window.visualViewport;
    function sync() {
        const wrap = document.getElementById('app-wrapper');
        wrap.style.height = `${vp.height}px`;
        wrap.style.top = `${vp.offsetTop}px`;
        window.scrollTo(0, 0);
    }
    vp.addEventListener('resize', sync);

    function speak(text) {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'nl-NL';
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
    }

    function loadData() {
        const file = document.getElementById('file-input').files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            masterList = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1})
                .slice(1).filter(r => r[1] && r[2]).map(r => ({en: String(r[1]).trim(), nl: String(r[2]).trim()}));
            document.getElementById('mode-selection').classList.remove('hidden');
        };
        reader.readAsArrayBuffer(file);
    }

    function setMode(m) {
        appMode = m;
        document.querySelectorAll('.btn').forEach(b => b.style.borderColor = '#eee');
        document.getElementById(`m-${m}`).style.borderColor = 'var(--blue)';
    }

    function showChapters() {
        document.getElementById('mode-tag').innerText = appMode.toUpperCase();
        const list = document.getElementById('chapter-list');
        list.innerHTML = '';
        const total = Math.ceil(masterList.length / 50);
        
        for(let i=0; i<total; i++) {
            const div = document.createElement('div');
            const status = progressMap[appMode][i] || ''; // '', 'inprogress', 'retry', 'completed'
            div.className = `chap-box status-${status}`;
            div.innerHTML = `<span>${i+1}</span>`;
            div.onclick = () => startChapter(i);
            list.appendChild(div);
        }
        showScreen('screen-chapters');
    }

    function startChapter(idx) {
        activeChapterIdx = idx;
        currentPool = masterList.slice(idx * 50, (idx + 1) * 50);
        retryQueue = [];
        currentIndex = 0;
        progressMap[appMode][idx] = 'inprogress';
        
        if(appMode === 'chat') {
            document.getElementById('chat-window').innerHTML = '';
            showScreen('screen-chat');
            nextChat();
        } else {
            showScreen('screen-quiz');
            nextQuiz();
        }
    }

    function nextQuiz() {
        if(currentIndex >= currentPool.length) return handleRoundEnd();
        const word = currentPool[currentIndex];
        renderProgress('quiz-progress-ui');
        document.getElementById('quiz-q').innerText = word.en;
        const grid = document.getElementById('quiz-options');
        grid.innerHTML = '';
        
        const distractors = generateDistractors(word.nl);
        const opts = [word.nl, ...distractors].sort(() => Math.random() - 0.5);

        opts.forEach(o => {
            const b = document.createElement('button');
            b.className = 'btn';
            b.innerText = o;
            b.onclick = () => {
                const isCorrect = o.toLowerCase() === word.nl.toLowerCase();
                b.style.background = isCorrect ? 'var(--green)' : 'var(--red)';
                b.style.color = 'white';
                speak(word.nl);
                if(!isCorrect) {
                    if(!retryQueue.includes(word)) retryQueue.push(word);
                    progressMap[appMode][activeChapterIdx] = 'retry';
                }
                setTimeout(() => { currentIndex++; nextQuiz(); }, 1200);
            };
            grid.appendChild(b);
        });
    }

    function nextChat() {
        if(currentIndex >= currentPool.length) return handleRoundEnd();
        const word = currentPool[currentIndex];
        renderProgress('chat-progress-ui');
        const win = document.getElementById('chat-window');
        const m = document.createElement('div');
        m.className = 'msg bot';
        m.innerText = `Translate: "${word.en}"`;
        win.appendChild(m);
        win.scrollTop = win.scrollHeight;
    }

    function handleChatSubmit() {
        const inp = document.getElementById('chat-in');
        const val = inp.value.trim();
        if(!val) return;
        const word = currentPool[currentIndex];
        const isCorrect = val.toLowerCase() === word.nl.toLowerCase();
        
        const win = document.getElementById('chat-window');
        const u = document.createElement('div'); u.className = 'msg user'; u.innerText = val;
        win.appendChild(u);

        const b = document.createElement('div');
        speak(word.nl);
        if(isCorrect) {
            b.className = 'msg bot'; b.innerText = "✅ Correct!";
        } else {
            b.className = 'msg bot err-msg'; b.innerHTML = `❌ Wrong. Answer: <b>${word.nl}</b>`;
            if(!retryQueue.includes(word)) retryQueue.push(word);
            progressMap[appMode][activeChapterIdx] = 'retry';
        }
        win.appendChild(b);
        win.scrollTop = win.scrollHeight;
        inp.value = '';
        setTimeout(() => { currentIndex++; nextChat(); }, 1500);
    }

    function handleRoundEnd() {
        if(retryQueue.length > 0) {
            alert(`Round finished. Starting retry round for ${retryQueue.length} missed words.`);
            currentPool = [...retryQueue];
            retryQueue = [];
            currentIndex = 0;
            if(appMode === 'chat') {
                const win = document.getElementById('chat-window');
                win.innerHTML += `<div style="text-align:center; color:var(--red); padding:20px;"><b>--- Retry Round ---</b></div>`;
                nextChat();
            } else {
                nextQuiz();
            }
        } else {
            progressMap[appMode][activeChapterIdx] = 'completed';
            alert("Chapter Complete! 100% Mastery.");
            showChapters();
        }
    }

    function generateDistractors(correct) {
        let s = new Set();
        const v = ['a','e','i','o','u','aa','ee'];
        while(s.size < 3) {
            let m = correct;
            if(Math.random() > 0.5) m = correct.replace(/[aeiou]/g, () => v[Math.floor(Math.random()*v.length)]);
            else m = correct.split('').sort(() => Math.random()-0.5).join('');
            if(m !== correct) s.add(m);
        }
        return Array.from(s);
    }

    function renderProgress(id) {
        const ui = document.getElementById(id);
        const total = currentPool.length;
        ui.innerHTML = `<div class="num-circle start">${currentIndex+1}</div><div class="prog-track" id="bar-${id}"></div><div class="num-circle end">${total}</div>`;
        const bar = document.getElementById(`bar-${id}`);
        for(let i=0; i<total; i++) {
            const bit = document.createElement('div');
            bit.className = `prog-bit ${i <= currentIndex ? 'active' : ''}`;
            bar.appendChild(bit);
        }
    }

    function confirmExit() { if(confirm("Progress in this round will be lost. Exit?")) showChapters(); }
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(id).classList.add('active-screen');
        sync();
    }
</script>
</body>
</html>
