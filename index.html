<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>Dutch Mastery Elite</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { 
            --orange: #ff4f00; --blue: #4b63ff; --bg: #ffffff; 
            --green: #2db162; --red: #ea5936; --gray-light: #f0f2f5; 
            --text: #3c3c3c;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { 
            width: 100%; height: 100%; margin: 0; padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg); color: var(--text); 
            overflow: hidden; position: fixed;
        }
        
        /* Main Container for Viewport Management */
        #app-wrapper {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column;
        }

        .screen { 
            position: absolute; inset: 0; background: white; z-index: 10; 
            display: none; flex-direction: column; 
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
        }
        .active-screen { display: flex; }

        /* Navigation Header */
        .nav-header {
            width: 100%; display: flex; align-items: center; 
            height: 60px; flex-shrink: 0;
        }
        .nav-back { 
            background: #f0f2f5; border: none; font-size: 16px; 
            padding: 8px 12px; border-radius: 8px; font-weight: 500;
        }

        /* Progress Bar */
        .progress-header { 
            width: 100%; display: flex; align-items: center; gap: 8px; margin-bottom: 15px; 
        }
        .prog-seg-container { flex: 1; display: flex; gap: 4px; }
        .prog-seg { flex: 1; height: 6px; background: #eee; border-radius: 10px; overflow: hidden; }
        .prog-fill { height: 100%; background: #eee; transition: width 0.3s; }
        .prog-fill.active { background: var(--orange); }
        .count-circle { 
            width: 24px; height: 24px; background: var(--orange); 
            color: white; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-size: 10px; font-weight: bold;
        }

        /* CHAT WINDOW: WHATSAPP STYLE */
        #chat-screen-content {
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
        }
        #chat-window { 
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; 
            gap: 10px; padding: 10px 0; -webkit-overflow-scrolling: touch;
        }
        .msg { padding: 10px 14px; border-radius: 18px; max-width: 80%; font-size: 16px; line-height: 1.4; }
        .bot { align-self: flex-start; background: var(--gray-light); border-bottom-left-radius: 4px; }
        .user { align-self: flex-end; background: var(--blue); color: white; border-bottom-right-radius: 4px; }
        
        .chat-input-container { 
            padding: 10px 0; background: white; border-top: 1px solid #eee;
            display: flex; gap: 10px; align-items: center;
        }
        .chat-input-container input { 
            flex: 1; padding: 12px 15px; border-radius: 25px; border: 1px solid #ddd; 
            font-size: 16px; outline: none; background: #f9f9f9;
        }
        .send-btn {
            background: var(--blue); color: white; border: none; 
            width: 44px; height: 44px; border-radius: 50%; font-weight: bold;
        }

        /* Grid for Chapters */
        #chapter-list { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; 
            width: 100%; overflow-y: auto; padding: 10px 0;
        }
        .chap-item { 
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            border: 2px solid #ddd; border-radius: 12px; font-weight: bold; 
        }
        .chap-item.in-progress { border-color: var(--orange); color: var(--orange); }
        .chap-item.completed { background: var(--green); color: white; border-color: var(--green); }
        .chap-item.has-errors { background: var(--red); color: white; border-color: var(--red); }

        /* Quiz UI */
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 20px; }
        .opt-btn { width: 100%; padding: 16px; border: 1px solid #ddd; border-radius: 12px; background: white; font-size: 16px; text-align: left; }

        .btn { width: 100%; max-width: 280px; padding: 14px; margin: 5px 0; border-radius: 12px; font-weight: bold; border: 1px solid #eee; }
        .primary-btn { background: var(--blue); color: white; border: none; }
        .mode-btn.selected { border-color: var(--blue); background: #f0f3ff; color: var(--blue); }
        .hidden { display: none !important; }
        .content-center { justify-content: center; align-items: center; text-align: center; }
    </style>
</head>
<body>

<div id="app-wrapper">
    <!-- SETUP SCREEN -->
    <div id="screen-setup" class="screen active-screen content-center">
        <h1 style="color:var(--blue)">🇳🇱 Dutch Mastery</h1>
        <div id="file-upload-section">
            <input type="file" id="file-input" accept=".xlsx, .csv" style="margin-bottom: 20px;">
            <button class="btn primary-btn" onclick="loadData()">Load Vocabulary</button>
        </div>
        <div id="mode-selection" class="hidden">
            <div style="display:flex; gap:10px; width: 100%; margin-bottom: 20px;">
                <button class="btn mode-btn" id="m-chat" onclick="setMode('chat')">💬 Chat</button>
                <button class="btn mode-btn selected" id="m-quiz" onclick="setMode('quiz')">🔘 Quiz</button>
            </div>
            <button class="btn primary-btn" onclick="goToChapters()">Open Chapters</button>
        </div>
    </div>

    <!-- CHAPTER SCREEN -->
    <div id="screen-chapters" class="screen">
        <div class="nav-header"><button class="nav-back" onclick="goToMenu()">⇠ Menu</button></div>
        <h2 id="chap-header" style="margin: 0 0 15px 0;">Chapters</h2>
        <div id="chapter-list"></div>
    </div>

    <!-- CHAT SCREEN (WhatsApp style) -->
    <div id="screen-chat" class="screen">
        <div class="nav-header"><button class="nav-back" onclick="goToChapters()">⇠ Back</button></div>
        <div class="progress-header" id="chat-prog"></div>
        <div id="chat-screen-content">
            <div id="chat-window"></div>
            <div class="chat-input-container">
                <input type="text" id="chat-in" placeholder="Type Dutch..." autocomplete="off">
                <button class="send-btn" onclick="handleChatSubmit()">➔</button>
            </div>
        </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="screen-quiz" class="screen">
        <div class="nav-header"><button class="nav-back" onclick="goToChapters()">⇠ Back</button></div>
        <div class="progress-header" id="quiz-prog"></div>
        <div style="margin-top: 20px;">
            <div style="color:#999; font-size: 12px; font-weight: bold; text-transform: uppercase;">Definition</div>
            <div id="quiz-q-text" style="font-size: 26px; font-weight: 500; margin: 10px 0 30px 0;">...</div>
            <div class="options-grid" id="quiz-options-grid"></div>
        </div>
    </div>

    <!-- MASTERY SCREEN -->
    <div id="screen-mastery" class="screen content-center">
        <h1 id="mastery-msg">Results</h1>
        <button class="btn primary-btn" id="retry-btn" onclick="retryMistakes()">Retry Mistakes</button>
        <button class="btn" onclick="goToChapters()">Chapters</button>
    </div>
</div>

<script>
    let masterList = [], currentPool = [], wrongAnswers = [];
    let chatStatus = {}, quizStatus = {}; 
    let appMode = 'quiz', currentIndex = 0, currentWord = null, isLocked = false, activeChapterId = -1;

    // IOS KEYBOARD HANDLING
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
            const offset = window.innerHeight - window.visualViewport.height;
            document.body.style.height = `${window.visualViewport.height}px`;
            document.getElementById('app-wrapper').style.bottom = `${offset}px`;
            // Scroll chat to bottom when keyboard opens
            const win = document.getElementById('chat-window');
            win.scrollTop = win.scrollHeight;
        });
    }

    document.getElementById('chat-in').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleChatSubmit(); });

    function setMode(m) {
        appMode = m;
        document.getElementById('m-chat').classList.toggle('selected', m === 'chat');
        document.getElementById('m-quiz').classList.toggle('selected', m === 'quiz');
    }

    async function loadData() {
        const file = document.getElementById('file-input').files[0];
        if (!file) return;
        const data = await file.arrayBuffer();
        const wb = XLSX.read(data);
        masterList = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1})
            .slice(1).filter(r => r[1] && r[2]).map(r => ({en: String(r[1]).trim(), nl: String(r[2]).trim()}));
        document.getElementById('file-upload-section').classList.add('hidden');
        document.getElementById('mode-selection').classList.remove('hidden');
    }

    function goToMenu() { showScreen('screen-setup'); }
    function goToChapters() {
        const container = document.getElementById('chapter-list');
        container.innerHTML = '';
        const total = Math.ceil(masterList.length / 50);
        const statusMap = appMode === 'chat' ? chatStatus : quizStatus;
        for(let i=0; i<total; i++) {
            const div = document.createElement('div');
            const s = statusMap[i] || 'none';
            div.className = `chap-item ${s === 'pending' ? 'in-progress' : s === 'done' ? 'completed' : s === 'error' ? 'has-errors' : ''}`;
            div.innerText = i + 1;
            div.onclick = () => startSession(masterList.slice(i*50, (i+1)*50), i);
            container.appendChild(div);
        }
        showScreen('screen-chapters');
    }

    function startSession(words, id) {
        currentPool = [...words]; wrongAnswers = []; currentIndex = 0; activeChapterId = id;
        if (appMode === 'chat') { 
            chatStatus[id] = 'pending'; 
            document.getElementById('chat-window').innerHTML = '';
            showScreen('screen-chat'); 
            setupProgressUI(); nextChat(); 
        } else { 
            quizStatus[id] = 'pending'; 
            showScreen('screen-quiz'); 
            setupProgressUI(); nextQuiz(); 
        }
    }

    function setupProgressUI() {
        const target = appMode === 'chat' ? 'chat-prog' : 'quiz-prog';
        const container = document.getElementById(target);
        container.innerHTML = `<div class="count-circle">${currentIndex + 1}</div><div class="prog-seg-container" id="${appMode}-seg-bars"></div><div class="count-circle" style="background:#eee; color:#999;">${currentPool.length}</div>`;
        const bars = document.getElementById(`${appMode}-seg-bars`);
        for(let i=0; i<currentPool.length; i++) bars.innerHTML += `<div class="prog-seg"><div class="prog-fill" id="${appMode}-fill-${i}"></div></div>`;
    }

    function updateProgressBar() {
        for(let i=0; i<=currentIndex; i++) {
            const f = document.getElementById(`${appMode}-fill-${i}`);
            if(f) { f.style.width = '100%'; f.classList.add('active'); }
        }
    }

    function nextChat() {
        if (currentIndex >= currentPool.length) return endSession();
        currentWord = currentPool[currentIndex]; isLocked = false; updateProgressBar();
        const win = document.getElementById('chat-window');
        const botMsg = document.createElement('div'); botMsg.className = 'msg bot';
        botMsg.innerText = `Translate: "${currentWord.en}"`;
        win.appendChild(botMsg); win.scrollTop = win.scrollHeight;
    }

    function handleChatSubmit() {
        const inp = document.getElementById('chat-in');
        if (!inp.value || isLocked) return;
        isLocked = true;
        const val = inp.value.trim();
        const correct = val.toLowerCase() === currentWord.nl.toLowerCase();
        const win = document.getElementById('chat-window');
        
        const userMsg = document.createElement('div'); userMsg.className = 'msg user'; userMsg.innerText = val; 
        win.appendChild(userMsg);
        
        const botResp = document.createElement('div'); botResp.className = 'msg bot';
        if(correct) botResp.innerHTML = `✅ Correct!`;
        else { wrongAnswers.push(currentWord); botResp.innerHTML = `❌ Answer: <b>${currentWord.nl}</b>`; }
        win.appendChild(botResp); win.scrollTop = win.scrollHeight;
        
        speak(currentWord.nl);
        inp.value = '';
        setTimeout(() => { currentIndex++; nextChat(); }, 1200);
    }

    function nextQuiz() {
        if (currentIndex >= currentPool.length) return endSession();
        currentWord = currentPool[currentIndex]; isLocked = false; updateProgressBar();
        document.getElementById('quiz-q-text').innerText = currentWord.en;
        const grid = document.getElementById('quiz-options-grid'); grid.innerHTML = '';
        let opts = [currentWord.nl];
        while(opts.length < 4) {
            let dist = mutate(currentWord.nl);
            if(!opts.includes(dist)) opts.push(dist);
        }
        opts.sort(() => Math.random() - 0.5);
        opts.forEach(o => {
            const b = document.createElement('button'); b.className = 'opt-btn'; b.innerText = o;
            b.onclick = () => {
                if(isLocked) return; isLocked = true; speak(currentWord.nl);
                if(o === currentWord.nl) b.style.borderColor = 'var(--green)';
                else { b.style.borderColor = 'var(--red)'; wrongAnswers.push(currentWord); }
                setTimeout(() => { currentIndex++; nextQuiz(); }, 1200);
            };
            grid.appendChild(b);
        });
    }

    function endSession() {
        showScreen('screen-mastery');
        const res = (wrongAnswers.length === 0) ? 'done' : 'error';
        if (appMode === 'chat') chatStatus[activeChapterId] = res; else quizStatus[activeChapterId] = res;
        document.getElementById('mastery-msg').innerText = (wrongAnswers.length === 0) ? "Mastered!" : "Review Required";
        document.getElementById('retry-btn').classList.toggle('hidden', wrongAnswers.length === 0);
    }

    function retryMistakes() { startSession(wrongAnswers, activeChapterId); }
    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen')); document.getElementById(id).classList.add('active-screen'); }
    function speak(t) { window.speechSynthesis.cancel(); const m = new SpeechSynthesisUtterance(t); m.lang = 'nl-NL'; window.speechSynthesis.speak(m); }
    function mutate(w) { let a = w.split(''); let i = Math.floor(Math.random()*a.length); a[i] = 'aeiou'.charAt(Math.floor(Math.random()*5)); return a.join('') === w ? mutate(w) : a.join(''); }
</script>
</body>
</html>
