<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>Dutch Mastery Elite</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --orange: #ff4f00; --blue: #4b63ff; --bg: #ffffff; --green: #2db162; --red: #ea5936; --gray-light: #f0f2f5; --text: #3c3c3c; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; font-family: "Segoe UI", sans-serif; background-color: var(--bg); color: var(--text); overflow: hidden; }
        
        .screen { position: absolute; inset: 0; background: white; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 25px; }
        .active-screen { display: flex; }

        /* Progress Header */
        .progress-header { width: 100%; max-width: 800px; display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
        .prog-seg-container { flex: 1; display: flex; gap: 6px; }
        .prog-seg { flex: 1; height: 10px; background: #e5e5e5; border-radius: 10px; overflow: hidden; }
        .prog-fill { height: 100%; background: #e5e5e5; transition: width 0.3s; }
        .prog-fill.active { background: var(--orange); }
        .count-circle { width: 30px; height: 30px; background: var(--orange); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }

        .nav-back { position: absolute; top: 20px; left: 20px; background: none; border: none; font-size: 24px; cursor: pointer; color: #777; }

        /* Status Colors for Chapters */
        .chap-item { padding: 15px; border: 2px solid #ddd; border-radius: 12px; cursor: pointer; text-align: center; font-weight: bold; transition: 0.2s; }
        .chap-item.in-progress { border-color: var(--orange); color: var(--orange); background: #fff8f5; }
        .chap-item.completed { border-color: var(--green); color: white; background: var(--green); }
        .chap-item.has-errors { border-color: var(--red); color: white; background: var(--red); }

        /* Chat/Quiz UI */
        #chat-window { width: 100%; max-width: 600px; height: 40vh; overflow-y: auto; border: 1px solid #eee; border-radius: 15px; padding: 15px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 80%; line-height: 1.4; }
        .bot { align-self: flex-start; background: var(--gray-light); }
        .user { align-self: flex-end; background: var(--blue); color: white; }
        .chat-input-area { width: 100%; max-width: 600px; display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 15px; border-radius: 12px; border: 2px solid #eee; }

        .quiz-card { width: 90%; max-width: 700px; border: 2px solid #e5e5e5; border-radius: 20px; padding: 30px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .opt-btn { width: 100%; padding: 18px; border: 2px solid #e5e5e5; border-radius: 15px; background: white; text-align: left; cursor: pointer; font-size: 16px; }
        .opt-btn.correct { border-color: var(--green); background: #e8f5e9; color: var(--green); font-weight: bold; }
        .opt-btn.wrong { border-color: var(--red); background: #fdf2f0; color: var(--red); font-weight: bold; }

        .btn { width: 100%; max-width: 300px; padding: 15px; margin: 8px 0; border: 2px solid #eee; border-radius: 12px; background: white; font-weight: bold; cursor: pointer; }
        .primary-btn { background: var(--blue); color: white; border: none; }
        .mode-btn.selected { border-color: var(--blue); background: #f0f3ff; color: var(--blue); }
        .hidden { display: none !important; }

        #chapter-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 20px; width: 100%; max-width: 600px; }
    </style>
</head>
<body>

<div id="app-wrapper">
    <div id="screen-setup" class="screen active-screen">
        <h1 style="color:var(--blue)">🇳🇱 Dutch Mastery</h1>
        <div id="file-upload-section">
            <input type="file" id="file-input" accept=".xlsx, .csv" style="margin: 20px 0;">
            <button class="btn primary-btn" onclick="loadData()">Load Vocabulary</button>
        </div>
        <div id="mode-selection" class="hidden">
            <div style="display:flex; gap:10px; margin-bottom: 20px;">
                <button class="btn mode-btn" id="m-chat" onclick="setMode('chat')">💬 Chat</button>
                <button class="btn mode-btn selected" id="m-quiz" onclick="setMode('quiz')">🔘 Quiz</button>
            </div>
            <button class="btn primary-btn" onclick="goToChapters()">Select Chapter</button>
            <button class="btn" style="color:var(--red); border:none;" onclick="resetFile()">Change File</button>
        </div>
    </div>

    <div id="screen-chapters" class="screen">
        <button class="nav-back" onclick="goToMenu()">⇠</button>
        <h2 id="chap-header">Chapters Overview</h2>
        <div id="chapter-list"></div>
    </div>

    <!-- Practice Screens & Mastery remains the same structure -->
    <div id="screen-chat" class="screen">
        <button class="nav-back" onclick="goToChapters()">⇠</button>
        <div class="progress-header" id="chat-prog"></div>
        <div id="chat-window"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-in" placeholder="Type Dutch translation...">
            <button class="btn primary-btn" style="width: auto; margin:0;" onclick="handleChatSubmit()">Send</button>
        </div>
    </div>

    <div id="screen-quiz" class="screen">
        <button class="nav-back" onclick="goToChapters()">⇠</button>
        <div class="progress-header" id="quiz-prog"></div>
        <div class="quiz-card">
            <div id="quiz-q-text" style="font-size: 28px; font-weight: 500;">...</div>
            <div class="options-grid" id="quiz-options-grid"></div>
        </div>
    </div>

    <div id="screen-mastery" class="screen">
        <h1 id="mastery-msg">Results</h1>
        <button class="btn primary-btn" id="retry-btn" onclick="retryMistakes()">Retry Mistakes</button>
        <button class="btn" onclick="goToChapters()">Return to Overview</button>
    </div>
</div>

<script>
    let masterList = [], currentPool = [], wrongAnswers = [];
    // INDEPENDENT STATUS STORAGE
    let chatStatus = {}, quizStatus = {}; 
    let appMode = 'quiz', currentIndex = 0, currentWord = null, isLocked = false, activeChapterId = -1;

    document.getElementById('chat-in').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleChatSubmit(); });

    function setMode(m) {
        appMode = m;
        document.getElementById('m-chat').classList.toggle('selected', m === 'chat');
        document.getElementById('m-quiz').classList.toggle('selected', m === 'quiz');
    }

    async function loadData() {
        const file = document.getElementById('file-input').files[0];
        if (!file) return alert("Select a file.");
        const data = await file.arrayBuffer();
        const wb = XLSX.read(data);
        masterList = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1})
            .slice(1).filter(r => r[1] && r[2]).map(r => ({en: String(r[1]).trim(), nl: String(r[2]).trim()}));
        document.getElementById('file-upload-section').classList.add('hidden');
        document.getElementById('mode-selection').classList.remove('hidden');
    }

    function goToMenu() { showScreen('screen-setup'); }
    function resetFile() { location.reload(); }

    function goToChapters() {
        const container = document.getElementById('chapter-list');
        container.innerHTML = '';
        document.getElementById('chap-header').innerText = `${appMode.charAt(0).toUpperCase() + appMode.slice(1)} Overview`;
        
        const total = Math.ceil(masterList.length / 50);
        const currentStatusMap = appMode === 'chat' ? chatStatus : quizStatus; // Independent lookup

        for(let i=0; i<total; i++) {
            const div = document.createElement('div');
            const status = currentStatusMap[i] || 'none';
            div.className = `chap-item ${status === 'pending' ? 'in-progress' : status === 'done' ? 'completed' : status === 'error' ? 'has-errors' : ''}`;
            div.innerText = i + 1;
            div.onclick = () => startSession(masterList.slice(i*50, (i+1)*50), i);
            container.appendChild(div);
        }
        showScreen('screen-chapters');
    }

    function startSession(words, id) {
        currentPool = [...words];
        wrongAnswers = [];
        currentIndex = 0;
        activeChapterId = id;
        
        // Update mode-specific status
        if (appMode === 'chat') chatStatus[id] = 'pending';
        else quizStatus[id] = 'pending';

        setupProgressUI();
        appMode === 'chat' ? (document.getElementById('chat-window').innerHTML = '', showScreen('screen-chat'), nextChat()) : (showScreen('screen-quiz'), nextQuiz());
    }

    // Progress UI, Audio, and Logic functions remain consistent with the previous logic
    function setupProgressUI() {
        const target = appMode === 'chat' ? 'chat-prog' : 'quiz-prog';
        const container = document.getElementById(target);
        container.innerHTML = `<div class="count-circle">${currentIndex + 1}</div><div class="prog-seg-container" id="${appMode}-seg-bars"></div><div class="count-circle" style="background:#e5e5e5; color:#777;">${currentPool.length}</div>`;
        const bars = document.getElementById(`${appMode}-seg-bars`);
        for(let i=0; i<currentPool.length; i++) bars.innerHTML += `<div class="prog-seg"><div class="prog-fill" id="${appMode}-fill-${i}"></div></div>`;
    }

    function updateProgressBar() {
        for(let i=0; i<=currentIndex; i++) {
            const f = document.getElementById(`${appMode}-fill-${i}`);
            if(f) { f.style.width = '100%'; f.classList.add('active'); }
        }
        const counts = document.querySelectorAll('.count-circle');
        if(counts[0]) counts[0].innerText = currentIndex + 1;
    }

    function nextChat() {
        if (currentIndex >= currentPool.length) return endSession();
        currentWord = currentPool[currentIndex]; isLocked = false; updateProgressBar();
        const win = document.getElementById('chat-window');
        const botMsg = document.createElement('div'); botMsg.className = 'msg bot';
        botMsg.innerText = `Translate: "${currentWord.en}"`;
        win.appendChild(botMsg); win.scrollTop = win.scrollHeight;
    }

    function handleChatSubmit() {
        const inp = document.getElementById('chat-in');
        if (!inp.value || isLocked) return;
        isLocked = true;
        const val = inp.value.trim();
        const correct = val.toLowerCase() === currentWord.nl.toLowerCase();
        const win = document.getElementById('chat-window');
        const userMsg = document.createElement('div'); userMsg.className = 'msg user'; userMsg.innerText = val; win.appendChild(userMsg);
        
        const botResp = document.createElement('div'); botResp.className = 'msg bot';
        if(correct) botResp.innerHTML = `✅ Correct!`;
        else { wrongAnswers.push(currentWord); botResp.innerHTML = `❌ Answer: <b>${currentWord.nl}</b>`; }
        win.appendChild(botResp); win.scrollTop = win.scrollHeight;
        
        speak(currentWord.nl);
        inp.value = '';
        setTimeout(() => { currentIndex++; nextChat(); }, 1600);
    }

    function nextQuiz() {
        if (currentIndex >= currentPool.length) return endSession();
        currentWord = currentPool[currentIndex]; isLocked = false; updateProgressBar();
        document.getElementById('quiz-q-text').innerText = currentWord.en;
        const grid = document.getElementById('quiz-options-grid'); grid.innerHTML = '';
        let opts = [currentWord.nl];
        while(opts.length < 4) {
            let dist = mutate(currentWord.nl);
            if(!opts.includes(dist)) opts.push(dist);
        }
        opts.sort(() => Math.random() - 0.5);
        opts.forEach(o => {
            const b = document.createElement('button'); b.className = 'opt-btn'; b.innerText = o;
            b.onclick = () => {
                if(isLocked) return; isLocked = true; speak(currentWord.nl);
                if(o === currentWord.nl) b.classList.add('correct');
                else { b.classList.add('wrong'); wrongAnswers.push(currentWord); Array.from(grid.children).forEach(cb => { if(cb.innerText === currentWord.nl) cb.classList.add('correct'); }); }
                setTimeout(() => { currentIndex++; nextQuiz(); }, 1500);
            };
            grid.appendChild(b);
        });
    }

    function endSession() {
        showScreen('screen-mastery');
        const finalStatus = (wrongAnswers.length === 0) ? 'done' : 'error';
        
        // Save status based on mode
        if (appMode === 'chat') chatStatus[activeChapterId] = finalStatus;
        else quizStatus[activeChapterId] = finalStatus;

        if(wrongAnswers.length === 0) {
            document.getElementById('mastery-msg').innerText = "100% Mastery!";
            document.getElementById('retry-btn').classList.add('hidden');
        } else {
            document.getElementById('mastery-msg').innerText = `Review Mistakes (${wrongAnswers.length})`;
            document.getElementById('retry-btn').classList.remove('hidden');
        }
    }

    function retryMistakes() { startSession(wrongAnswers, activeChapterId); }
    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen')); document.getElementById(id).classList.add('active-screen'); }
    function speak(t) { window.speechSynthesis.cancel(); const m = new SpeechSynthesisUtterance(t); m.lang = 'nl-NL'; window.speechSynthesis.speak(m); }
    function mutate(w) { let a = w.split(''); let i = Math.floor(Math.random()*a.length); a[i] = 'aeiou'.charAt(Math.floor(Math.random()*5)); return a.join('') === w ? mutate(w) : a.join(''); }
</script>
</body>
</html>
