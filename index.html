<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>Dutch Mastery Elite</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { 
            --orange: #ff4f00; --blue: #4b63ff; --bg: #ffffff; 
            --green: #2db162; --red: #ea5936; --gray-light: #f0f2f5; 
            --text: #3c3c3c;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { 
            width: 100%; height: 100%; margin: 0; padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg); color: var(--text); 
            overflow: hidden; position: fixed; touch-action: none;
        }
        
        /* The container that shrinks when the keyboard opens */
        #app-wrapper {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column;
            background: white;
        }

        .screen { 
            flex: 1; width: 100%; display: none; flex-direction: column; 
            padding: env(safe-area-inset-top) 20px 0 20px;
            overflow: hidden;
        }
        .active-screen { display: flex; }

        .nav-header { width: 100%; height: 50px; display: flex; align-items: center; flex-shrink: 0; }
        .nav-back { background: #f0f2f5; border: none; padding: 8px 15px; border-radius: 20px; font-weight: 600; }

        .progress-header { width: 100%; display: flex; align-items: center; gap: 8px; height: 30px; flex-shrink: 0; }
        .prog-seg-container { flex: 1; display: flex; gap: 4px; }
        .prog-seg { flex: 1; height: 6px; background: #eee; border-radius: 10px; }
        .prog-fill { height: 100%; background: #eee; border-radius: 10px; transition: width 0.3s; }
        .prog-fill.active { background: var(--orange); }

        /* WHATSAPP-STYLE CHAT LAYOUT */
        #chat-window { 
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; 
            gap: 12px; padding: 20px 0; -webkit-overflow-scrolling: touch;
        }
        .msg { padding: 12px 16px; border-radius: 20px; max-width: 85%; font-size: 17px; }
        .bot { align-self: flex-start; background: var(--gray-light); color: var(--text); border-bottom-left-radius: 5px; }
        .user { align-self: flex-end; background: var(--blue); color: white; border-bottom-right-radius: 5px; }
        
        .chat-input-container { 
            width: 100%; background: white; border-top: 1px solid #eee;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom)) 0;
            display: flex; gap: 10px; align-items: center; flex-shrink: 0;
        }
        .chat-input-container input { 
            flex: 1; padding: 14px 20px; border-radius: 30px; border: 1px solid #ddd; 
            font-size: 16px; outline: none; background: #f8f8f8;
        }
        .send-btn { 
            background: var(--blue); color: white; border: none; 
            width: 48px; height: 48px; border-radius: 50%; font-size: 20px;
        }

        /* Chapter/Setup Screens */
        .content-center { justify-content: center; align-items: center; text-align: center; padding-bottom: env(safe-area-inset-bottom); }
        #chapter-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; overflow-y: auto; padding: 20px 0; }
        .chap-item { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border: 2px solid #ddd; border-radius: 15px; font-weight: bold; }
        .chap-item.completed { background: var(--green); color: white; border-color: var(--green); }
        .chap-item.has-errors { background: var(--red); color: white; border-color: var(--red); }
        
        .btn { width: 100%; max-width: 300px; padding: 16px; margin: 8px 0; border-radius: 15px; font-weight: bold; border: 1px solid #eee; font-size: 16px; }
        .primary-btn { background: var(--blue); color: white; border: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-wrapper">
    <!-- SETUP -->
    <div id="screen-setup" class="screen active-screen content-center">
        <h1 style="color:var(--blue); font-size: 32px;">🇳🇱 Dutch Mastery</h1>
        <div id="file-section">
            <input type="file" id="file-input" accept=".xlsx, .csv" style="margin-bottom: 20px;">
            <button class="btn primary-btn" onclick="loadData()">Load Vocabulary</button>
        </div>
        <div id="mode-selection" class="hidden">
            <div style="display:flex; gap:10px; width: 100%; margin-bottom: 20px;">
                <button class="btn" id="m-chat" onclick="setMode('chat')">💬 Chat</button>
                <button class="btn" id="m-quiz" onclick="setMode('quiz')">🔘 Quiz</button>
            </div>
            <button class="btn primary-btn" onclick="goToChapters()">Start Learning</button>
        </div>
    </div>

    <!-- CHAPTERS -->
    <div id="screen-chapters" class="screen">
        <div class="nav-header"><button class="nav-back" onclick="goToMenu()">⇠ Menu</button></div>
        <h2>Chapters</h2>
        <div id="chapter-list"></div>
    </div>

    <!-- CHAT -->
    <div id="screen-chat" class="screen">
        <div class="nav-header"><button class="nav-back" onclick="goToChapters()">⇠ Back</button></div>
        <div class="progress-header" id="chat-prog"></div>
        <div id="chat-window"></div>
        <div class="chat-input-container">
            <input type="text" id="chat-in" placeholder="Type Dutch..." autocomplete="off" autocorrect="off">
            <button class="send-btn" onclick="handleChatSubmit()">➔</button>
        </div>
    </div>

    <!-- QUIZ -->
    <div id="screen-quiz" class="screen">
        <div class="nav-header"><button class="nav-back" onclick="goToChapters()">⇠ Back</button></div>
        <div class="progress-header" id="quiz-prog"></div>
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
            <p style="color:#999; font-weight:bold; font-size:12px;">TRANSLATE THIS:</p>
            <h2 id="quiz-q-text" style="font-size: 30px; margin: 10px 0 40px 0;">...</h2>
            <div id="quiz-options-grid" style="display: grid; gap: 12px;"></div>
        </div>
    </div>
</div>

<script>
    let masterList = [], currentPool = [], wrongAnswers = [], chatStatus = {}, quizStatus = {}; 
    let appMode = 'quiz', currentIndex = 0, currentWord = null, isLocked = false, activeChapterId = -1;

    // IOS VIEWPORT RECOVERY
    const viewport = window.visualViewport;
    function handleViewportChange() {
        const wrapper = document.getElementById('app-wrapper');
        wrapper.style.height = `${viewport.height}px`;
        // Push scroll to bottom when keyboard opens
        if (document.getElementById('screen-chat').classList.contains('active-screen')) {
            const win = document.getElementById('chat-window');
            win.scrollTop = win.scrollHeight;
        }
    }
    viewport.addEventListener('resize', handleViewportChange);
    viewport.addEventListener('scroll', handleViewportChange);

    document.getElementById('chat-in').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleChatSubmit(); });

    function setMode(m) {
        appMode = m;
        document.getElementById('m-chat').style.borderColor = m === 'chat' ? 'var(--blue)' : '#eee';
        document.getElementById('m-quiz').style.borderColor = m === 'quiz' ? 'var(--blue)' : '#eee';
    }

    async function loadData() {
        const file = document.getElementById('file-input').files[0];
        if (!file) return;
        const data = await file.arrayBuffer();
        const wb = XLSX.read(data);
        masterList = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1})
            .slice(1).filter(r => r[1] && r[2]).map(r => ({en: String(r[1]).trim(), nl: String(r[2]).trim()}));
        document.getElementById('file-section').classList.add('hidden');
        document.getElementById('mode-selection').classList.remove('hidden');
        setMode('quiz');
    }

    function goToMenu() { showScreen('screen-setup'); }
    function goToChapters() {
        const container = document.getElementById('chapter-list');
        container.innerHTML = '';
        const total = Math.ceil(masterList.length / 50);
        const statusMap = appMode === 'chat' ? chatStatus : quizStatus;
        for(let i=0; i<total; i++) {
            const div = document.createElement('div');
            const s = statusMap[i] || 'none';
            div.className = `chap-item ${s === 'done' ? 'completed' : s === 'error' ? 'has-errors' : ''}`;
            div.innerText = i + 1;
            div.onclick = () => startSession(masterList.slice(i*50, (i+1)*50), i);
            container.appendChild(div);
        }
        showScreen('screen-chapters');
    }

    function startSession(words, id) {
        currentPool = [...words]; wrongAnswers = []; currentIndex = 0; activeChapterId = id;
        setupProgressUI();
        if(appMode === 'chat') { 
            document.getElementById('chat-window').innerHTML = ''; 
            showScreen('screen-chat'); nextChat(); 
        } else { 
            showScreen('screen-quiz'); nextQuiz(); 
        }
    }

    function setupProgressUI() {
        const target = appMode === 'chat' ? 'chat-prog' : 'quiz-prog';
        const container = document.getElementById(target);
        container.innerHTML = `<div class="prog-seg-container" id="${appMode}-seg-bars"></div>`;
        const bars = document.getElementById(`${appMode}-seg-bars`);
        for(let i=0; i<currentPool.length; i++) bars.innerHTML += `<div class="prog-seg"><div class="prog-fill" id="${appMode}-fill-${i}"></div></div>`;
    }

    function updateProgressBar() {
        for(let i=0; i<=currentIndex; i++) {
            const f = document.getElementById(`${appMode}-fill-${i}`);
            if(f) f.style.width = '100%';
            if(f) f.classList.add('active');
        }
    }

    function nextChat() {
        if (currentIndex >= currentPool.length) return finish();
        currentWord = currentPool[currentIndex]; isLocked = false; updateProgressBar();
        const win = document.getElementById('chat-window');
        const m = document.createElement('div'); m.className = 'msg bot';
        m.innerText = `Translate: "${currentWord.en}"`;
        win.appendChild(m); win.scrollTop = win.scrollHeight;
    }

    function handleChatSubmit() {
        const inp = document.getElementById('chat-in');
        if (!inp.value || isLocked) return;
        isLocked = true;
        const val = inp.value.trim();
        const win = document.getElementById('chat-window');
        const userM = document.createElement('div'); userM.className = 'msg user'; userM.innerText = val;
        win.appendChild(userM);
        
        const botM = document.createElement('div'); botM.className = 'msg bot';
        if(val.toLowerCase() === currentWord.nl.toLowerCase()) botM.innerText = "✅ Correct!";
        else { wrongAnswers.push(currentWord); botM.innerHTML = `❌ Wrong. It's: <b>${currentWord.nl}</b>`; }
        win.appendChild(botM);
        win.scrollTop = win.scrollHeight;
        
        const utterance = new SpeechSynthesisUtterance(currentWord.nl);
        utterance.lang = 'nl-NL'; window.speechSynthesis.speak(utterance);
        
        inp.value = '';
        setTimeout(() => { currentIndex++; nextChat(); }, 1200);
    }

    function nextQuiz() {
        if (currentIndex >= currentPool.length) return finish();
        currentWord = currentPool[currentIndex]; isLocked = false; updateProgressBar();
        document.getElementById('quiz-q-text').innerText = currentWord.en;
        const grid = document.getElementById('quiz-options-grid'); grid.innerHTML = '';
        let opts = [currentWord.nl];
        while(opts.length < 4) {
            let fake = masterList[Math.floor(Math.random()*masterList.length)].nl;
            if(!opts.includes(fake)) opts.push(fake);
        }
        opts.sort(() => Math.random() - 0.5).forEach(o => {
            const b = document.createElement('button'); b.className = 'btn'; b.innerText = o;
            b.onclick = () => {
                if(isLocked) return; isLocked = true;
                const utterance = new SpeechSynthesisUtterance(currentWord.nl);
                utterance.lang = 'nl-NL'; window.speechSynthesis.speak(utterance);
                if(o === currentWord.nl) b.style.background = 'var(--green)';
                else { b.style.background = 'var(--red)'; wrongAnswers.push(currentWord); }
                setTimeout(() => { currentIndex++; nextQuiz(); }, 1000);
            };
            grid.appendChild(b);
        });
    }

    function finish() {
        const success = wrongAnswers.length === 0;
        if(appMode === 'chat') chatStatus[activeChapterId] = success ? 'done' : 'error';
        else quizStatus[activeChapterId] = success ? 'done' : 'error';
        alert(success ? "Perfect! Chapter Mastered." : `Done! You missed ${wrongAnswers.length} words.`);
        goToChapters();
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(id).classList.add('active-screen');
        handleViewportChange();
    }
</script>
</body>
</html>
