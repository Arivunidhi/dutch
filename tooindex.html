<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>Dutch Trainer Fixed</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --dutch-orange: #ff4f00; --dutch-blue: #21468b; --bg: #f0f2f5; --success: #28a745; --danger: #dc3545; }
        
        * { box-sizing: border-box; }
        
        body, html { 
            height: 100%; margin: 0; padding: 0; 
            font-family: -apple-system, sans-serif; 
            background: var(--bg); 
            overflow: hidden; /* Prevents the whole body from scrolling */
            position: fixed; /* Extra layer of defense against iOS bounce */
            width: 100%;
        }

        /* Fixed Top Section */
        .header-section {
            position: fixed; top: 0; left: 0; right: 0; z-index: 10;
            background: white;
        }

        .chat-header { background: var(--dutch-orange); color: white; padding: 12px; text-align: center; font-weight: bold; }
        .progress-container { width: 100%; background: #ddd; height: 4px; }
        #progress-fill { height: 100%; width: 0%; background: var(--success); transition: width 0.3s; }
        .stats-bar { background: #222; color: #fff; padding: 8px; display: grid; grid-template-columns: 1fr 1fr; font-size: 12px; }
        .stat-item { display: flex; justify-content: space-between; padding: 0 10px; }

        /* Main Chat Container */
        .chat-container { 
            display: none; 
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
            flex-direction: column; 
            background: white;
            max-width: 500px; margin: 0 auto;
        }

        #chat-window { 
            flex: 1; 
            overflow-y: auto; 
            padding: 100px 15px 20px 15px; /* Top padding to clear the fixed header */
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            background: #f9f9f9;
            -webkit-overflow-scrolling: touch;
        }

        #suggestion-box { 
            background: #fff9c4; padding: 10px; text-align: center; 
            font-size: 14px; border-bottom: 1px solid #ddd;
            margin-top: -1px; /* Seamless fit under stats */
        }

        .message { max-width: 85%; padding: 12px; border-radius: 18px; font-size: 16px; }
        .bot { align-self: flex-start; background: #e9e9eb; border-bottom-left-radius: 4px; }
        .user { align-self: flex-end; background: var(--dutch-blue); color: white; border-bottom-right-radius: 4px; }

        /* Input Area Pinned to Keyboard */
        .input-area { 
            padding: 10px; border-top: 1px solid #eee; 
            display: flex; gap: 8px; background: white;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
        }

        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 25px; font-size: 16px; outline: none; -webkit-appearance: none; }
        button.send-btn { background: var(--dutch-orange); color: white; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; }

        /* Screens */
        .setup-box, .summary-box { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 400px; background: white; padding: 25px;
            border-radius: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 100;
        }
        .summary-box { display: none; max-height: 80vh; overflow-y: auto; }
        
        .speaker-btn { cursor: pointer; margin-left: 5px; }
        .review-list { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        .review-list td { border: 1px solid #ddd; padding: 6px; }
    </style>
</head>
<body>

<div class="setup-box" id="setup">
    <h2>🇳🇱 Dutch Trainer</h2>
    <input type="file" id="file-input" accept=".xlsx, .csv" style="width:100%; margin-bottom:20px;">
    <button onclick="handleFile()" style="width:100%; padding:15px; background:var(--dutch-orange); color:white; border:none; border-radius:10px; font-weight:bold;">Start Practice</button>
</div>

<div class="chat-container" id="chat-ui">
    <div class="header-section">
        <div class="chat-header">DUTCH PRACTICE</div>
        <div class="progress-container"><div id="progress-fill"></div></div>
        <div class="stats-bar">
            <div class="stat-item">Correct: <span id="stat-correct" style="color:#0f0">0</span></div>
            <div class="stat-item">Progress: <span id="stat-progress">0/0</span></div>
            <div class="stat-item">Wrong: <span id="stat-wrong" style="color:#f44">0</span></div>
            <div class="stat-item">Score: <span id="stat-score">0%</span></div>
        </div>
        <div id="suggestion-box">Select a file to begin...</div>
    </div>

    <div id="chat-window"></div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type answer..." autocomplete="off" onkeypress="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<div class="summary-box" id="summary">
    <div id="summary-content"></div>
    <div id="review-area"></div>
    <button onclick="location.reload()" style="margin-top:20px; padding:10px; width:100%;">Restart</button>
</div>

<script>
    let masterList = [];
    let remainingWords = [];
    let currentWord = null;
    let stats = { correct: 0, wrong: 0, attempted: 0 };
    let mistakes = [];

    async function handleFile() {
        const fileInput = document.getElementById('file-input');
        const file = fileInput.files[0];
        if (!file) return alert("Select a file!");
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data);
        const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
        masterList = jsonData.slice(1).filter(row => row[1] && row[2]).map(row => ({
            english: String(row[1]).trim(),
            dutch: String(row[2]).trim()
        }));
        if (masterList.length > 0) {
            remainingWords = [...masterList];
            document.getElementById('setup').style.display = 'none';
            document.getElementById('chat-ui').style.display = 'flex';
            updateStats();
            botAsk();
        }
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'nl-NL';
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
    }

    function updateStats() {
        const total = masterList.length;
        const score = stats.attempted === 0 ? 0 : Math.round((stats.correct / stats.attempted) * 100);
        document.getElementById('stat-correct').innerText = stats.correct;
        document.getElementById('stat-wrong').innerText = stats.wrong;
        document.getElementById('stat-progress').innerText = `${stats.attempted} / ${total}`;
        document.getElementById('stat-score').innerText = `${score}%`;
        document.getElementById('progress-fill').style.width = `${(stats.attempted / total) * 100}%`;
    }

    function addMessage(text, sender, wordToSpeak = null) {
        const win = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerText = text;
        if (wordToSpeak) {
            const btn = document.createElement('span');
            btn.className = 'speaker-btn'; btn.innerHTML = ' 🔊';
            btn.onclick = () => speak(wordToSpeak);
            div.appendChild(btn);
            speak(wordToSpeak);
        }
        win.appendChild(div);
        // Delay scroll to ensure keyboard has finished moving
        setTimeout(() => win.scrollTop = win.scrollHeight, 100);
    }

    function botAsk() {
        if (remainingWords.length === 0) { showSummary(); return; }
        const index = Math.floor(Math.random() * remainingWords.length);
        currentWord = remainingWords[index];
        remainingWords.splice(index, 1);
        addMessage(`How do you say "${currentWord.english}"?`, 'bot');
        document.getElementById('suggestion-box').innerText = `Hint: Starts with "${currentWord.dutch[0]}..."`;
    }

    function sendMessage() {
        const input = document.getElementById('user-input');
        const val = input.value.trim();
        if(!val || !currentWord) return;
        addMessage(val, 'user');
        input.value = '';
        stats.attempted++;
        setTimeout(() => {
            if (val.toLowerCase() === currentWord.dutch.toLowerCase()) {
                addMessage("✅ Correct!", 'bot', currentWord.dutch);
                stats.correct++;
            } else {
                addMessage(`❌ Incorrect: "${currentWord.dutch}"`, 'bot', currentWord.dutch);
                stats.wrong++;
                mistakes.push({ q: currentWord.english, a: currentWord.dutch, user: val });
            }
            updateStats();
            setTimeout(botAsk, 1200);
        }, 500);
    }

    function showSummary() {
        document.getElementById('chat-ui').style.display = 'none';
        const summary = document.getElementById('summary');
        const finalScore = Math.round((stats.correct / stats.attempted) * 100);
        summary.style.display = 'block';
        document.getElementById('summary-content').innerHTML = `
            <h2>${finalScore >= 90 ? "Excellent!" : "Keep Practicing"}</h2>
            <div style="font-size:3rem; font-weight:bold;">${finalScore}%</div>
        `;
        document.getElementById('review-area').innerHTML = mistakes.length > 0 ? 
            `<table class="review-list">` + mistakes.map(m => `<tr><td>${m.q}</td><td>${m.a}</td><td style="color:red">${m.user}</td></tr>`).join('') + `</table>` : "No mistakes!";
    }

    // THE ULTIMATE IOS KEYBOARD FIX
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
            // Force the container to be the height of the visible area only
            const chatContainer = document.getElementById('chat-ui');
            chatContainer.style.height = window.visualViewport.height + 'px';
            // Scroll to the bottom of the chat
            const win = document.getElementById('chat-window');
            win.scrollTop = win.scrollHeight;
        });
    }
</script>
</body>
</html>
