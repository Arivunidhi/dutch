<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dutch Learner - Column Adjusted</title>
    <style>
        :root { --dutch-orange: #ff4f00; --dutch-blue: #21468b; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .setup-box { background: white; padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 420px; text-align: center; border-top: 5px solid var(--dutch-orange); }
        .chat-container { width: 420px; height: 550px; background: white; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: none; flex-direction: column; overflow: hidden; }
        .chat-header { background: var(--dutch-orange); color: white; padding: 15px; text-align: center; font-weight: bold; letter-spacing: 1px; }
        #chat-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #fafafa; }
        .message { max-width: 80%; padding: 12px; border-radius: 15px; font-size: 0.95rem; line-height: 1.4; }
        .bot { align-self: flex-start; background: #eee; color: #333; border-bottom-left-radius: 2px; }
        .user { align-self: flex-end; background: var(--dutch-blue); color: white; border-bottom-right-radius: 2px; }
        .input-area { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; background: white; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { cursor: pointer; background: var(--dutch-orange); color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="setup-box" id="setup">
    <h2>🇳🇱 Welkom!</h2>
    <p>Upload your <b>.csv</b> to start practicing.</p>
    <input type="file" id="csv-file" accept=".csv">
    <div style="margin-top: 15px;">
        <button onclick="processFile()">Start Chatting</button>
    </div>
</div>

<div class="chat-container" id="chat-ui">
    <div class="chat-header">DUTCH CONVERSATION PARTNER</div>
    <div id="chat-window"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type here..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    let vocabulary = [];
    let currentWord = null;

    function processFile() {
        const fileInput = document.getElementById('csv-file');
        const file = fileInput.files[0];
        
        if (!file) {
            alert("Please select your Dutch CSV file!");
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            parseCSV(e.target.result);
        };
        reader.readAsText(file);
    }

    function parseCSV(data) {
        // Split by new line, then filter out empty lines
        const lines = data.split(/\r?\n/).filter(line => line.trim() !== "");
        
        // We start from index 1 if your first row is headers (English, Dutch, etc.)
        // Change '1' to '0' below if you don't have a header row
        const startRow = 1; 

        for (let i = startRow; i < lines.length; i++) {
            const columns = lines[i].split(',');
            
            // Your setup: Col 0 = ID, Col 1 = English, Col 2 = Dutch
            if (columns.length >= 3) {
                vocabulary.push({
                    english: columns[1].replace(/"/g, '').trim(),
                    dutch: columns[2].replace(/"/g, '').trim()
                });
            }
        }

        if (vocabulary.length > 0) {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('chat-ui').style.display = 'flex';
            addMessage("Hoi! I'm ready. Let's practice your words!", 'bot');
            botAsk();
        } else {
            alert("Hmm, I couldn't read the columns. Make sure column 2 is English and column 3 is Dutch!");
        }
    }

    function addMessage(text, sender) {
        const win = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerText = text;
        win.appendChild(div);
        win.scrollTop = win.scrollHeight;
    }

    function botAsk() {
        currentWord = vocabulary[Math.floor(Math.random() * vocabulary.length)];
        const prompts = [
            `How do you say "${currentWord.english}" in Dutch?`,
            `What is the Dutch translation for "${currentWord.english}"?`,
            `Do you know what "${currentWord.dutch}" means in English?`
        ];
        // Pick a random prompt
        const text = prompts[Math.floor(Math.random() * prompts.length)];
        setTimeout(() => addMessage(text, 'bot'), 600);
    }

    function sendMessage() {
        const input = document.getElementById('user-input');
        const val = input.value.trim();
        if(!val) return;

        addMessage(val, 'user');
        input.value = '';

        setTimeout(() => {
            const userVal = val.toLowerCase();
            const correctD = currentWord.dutch.toLowerCase();
            const correctE = currentWord.english.toLowerCase();

            // Check if user provided either the correct Dutch or English translation
            if (userVal === correctD || userVal === correctE) {
                addMessage("✅ Correct! Goed zo.", 'bot');
            } else {
                addMessage(`Oops! The answer is "${currentWord.dutch}" (${currentWord.english}).`, 'bot');
            }
            botAsk();
        }, 800);
    }
</script>
</body>
</html>
